          } else {
            cells += `<td class="tbx-cell tbx-cell-na${satCls}" title="הפועל לא היה משויך לקבוצה זו בתאריך זה">—</td>`;
          }
        });
        rowsHtml += `<tr data-crew-block="${cr.id}" data-worker-idnum="${esc(w.idNumber||'')}"><td class="tbx-serial-cell">${idx+1}</td><td class="tbx-id-cell">${esc(w.idNumber||'—')}</td><td class="tbx-name-cell">${esc(w.name||'')}${isInactive?' <span class="badge gray" style="font-size:9px;">לא פעיל</span>':''}</td>${cells}<td class="tbx-total-cell" data-worker-total="${w.id}__${cr.id}">0</td></tr>`;
      });
      const crewDayCells = days.map(d=>`<td class="tbx-crew-day-total${saturdays.has(d)?' tbx-saturday':''}" data-crew-id="${cr.id}" data-day="${d}">0</td>`).join('');
      // Separate serial/id/name cells (not one colspan cell) - a colspan cell sized/positioned
      // by the single-column sticky CSS rules visually overlapped the first few day columns.
      rowsHtml += `<tr class="tbx-crew-subtotal-row" data-crew-block="${cr.id}"><td class="tbx-serial-cell"></td><td class="tbx-id-cell"></td><td class="tbx-name-cell">סה"כ קבוצה</td>${crewDayCells}<td class="tbx-crew-grand-total" data-crew-id="${cr.id}">0</td></tr>`;

  body.innerHTML = `

  body.querySelectorAll('.tbx-cell-cb').forEach(cb=>{

      toolboxTogglePresence(toolboxProjectId, toolboxDateStr(d), wid, e.target.checked);
      toolboxRecomputeTotals(days, rowEntries);
      const statusEl = document.getElementById('tbx_saveStatus');
      if(statusEl) statusEl.textContent = 'נשמר אוטומטית · ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
    };
  });
  toolboxRecomputeTotals(days, rowEntries);
  toolboxApplySearchFilter();
}
/* Filters worker rows by substring match on ת.ז/דרכון (not name) - a group-header/crew-subtotal
   row hides too once none of its worker rows remain visible. Pure visibility toggle: doesn't
   touch toolboxRecords or the totals already computed above. */
function toolboxApplySearchFilter(){
  const body = document.getElementById('tbx_body');
  if(!body) return;
  const rows = body.querySelectorAll('.tbx-matrix tbody tr');
  const emptyNote = document.getElementById('tbx_search_empty');
  const q = (toolboxSearchQuery||'').trim();
  if(!q){
    rows.forEach(r=>{ r.style.display = ''; });
    if(emptyNote) emptyNote.style.display = 'none';
    return;
  }
  const visibleCrewBlocks = new Set();
  let anyWorkerVisible = false;
  rows.forEach(r=>{
    if(r.classList.contains('tbx-group-row') || r.classList.contains('tbx-crew-subtotal-row')) return;
    const match = (r.dataset.workerIdnum||'').includes(q);
    r.style.display = match ? '' : 'none';
    if(match){ visibleCrewBlocks.add(r.dataset.crewBlock); anyWorkerVisible = true; }
  });
  rows.forEach(r=>{
    if(r.classList.contains('tbx-group-row') || r.classList.contains('tbx-crew-subtotal-row')){
      r.style.display = visibleCrewBlocks.has(r.dataset.crewBlock) ? '' : 'none';
    }
  });
  if(emptyNote) emptyNote.style.display = anyWorkerVisible ? 'none' : '';
}
function toolboxTogglePresence(projectId, date, workerId, present){
  let rec = toolboxRecords.find(t=>t.projectId===projectId && t.date===date);
  if(!rec){
    rec = { id: uid('tbx'), projectId, date, presentWorkerIds: [] };
    toolboxRecords.push(rec);
  }
  if(present){ if(!rec.presentWorkerIds.includes(workerId)) rec.presentWorkerIds.push(workerId); }
  else { rec.presentWorkerIds = rec.presentWorkerIds.filter(id=>id!==workerId); }
  saveAll();
}
/* Recomputed straight from the checkbox states already in the DOM (rather than re-reading
   toolboxRecords) so a single click updates instantly without a full re-render.
   rowEntries: [{workerId, crewId}] - one entry per rendered worker/crew row. A worker who
   transferred crews mid-month has one entry per crew he actually held that month; each entry's
   checkboxes live only on the days that belonged to that crew (see renderToolboxMatrix), so the
   entries' day-sets never overlap and summing them never double-counts a day. */
function toolboxRecomputeTotals(days, rowEntries){
  let grand = 0;
  (rowEntries||[]).forEach(({workerId, crewId})=>{
    let count = 0;
    days.forEach(d=>{
      const cb = document.querySelector(`.tbx-cell-cb[data-worker-id="${workerId}"][data-crew-id="${crewId}"][data-day="${d}"]`);
      if(cb && cb.checked) count++;
    });
    const totalCell = document.querySelector(`[data-worker-total="${workerId}__${crewId}"]`);
    if(totalCell) totalCell.textContent = count;
    grand += count;
  });
  days.forEach(d=>{
    const dayCbs = document.querySelectorAll(`.tbx-cell-cb[data-day="${d}"]`);
    let count = 0;
    dayCbs.forEach(cb=>{ if(cb.checked) count++; });
    const dayCell = document.querySelector(`[data-day-total="${d}"]`);
    if(dayCell) dayCell.textContent = count;
  });
  const grandEl = document.getElementById('tbx-grand-total');
  if(grandEl) grandEl.textContent = grand;

  // Per-crew subtotals: every checkbox in the matrix carries the crew it actually belongs to
  // (data-crew-id) so this reads straight from the DOM instead of a separate worker list.
  const crewIds = Array.from(new Set((rowEntries||[]).map(r=>r.crewId)));
  crewIds.forEach(crewId=>{
    let crewGrand = 0;
    days.forEach(d=>{
      const cbs = document.querySelectorAll(`.tbx-cell-cb[data-crew-id="${crewId}"][data-day="${d}"]`);
      let count = 0;
      cbs.forEach(cb=>{ if(cb.checked) count++; });
      const cell = document.querySelector(`.tbx-crew-day-total[data-crew-id="${crewId}"][data-day="${d}"]`);
      if(cell) cell.textContent = count;
      crewGrand += count;
    });
    const crewTotalCell = document.querySelector(`.tbx-crew-grand-total[data-crew-id="${crewId}"]`);
    if(crewTotalCell) crewTotalCell.textContent = crewGrand;
  });
}

/* ===================== כרטיס עבודה: personal worker time-card (section 4.3) =====================
   Distinct from טולבוקס: a boolean presence checkmark has no notion of hours. Here every day
   gets a check-in/check-out time, and the card totals "ימים" (days worked) and "סה"כ שעות"
   (total hours) for the selected month - modeled after a paper/Excel time-card the user already
   uses, not tied to any specific project (workers/crews aren't project-scoped either). */
let wcContractorId = '';
let wcCrewId = '';
let wcWorkerId = '';
let wcMonth = todayStr().slice(0,7);

function workCardEntry(workerId, date){
  return workCardEntries.find(e=>e.workerId===workerId && e.date===date);
}
function setWorkCardTime(workerId, date, field, value){
  let e = workCardEntry(workerId, date);
  if(!e){
    if(!value) return; // nothing to create if both times are still empty
    e = {id: uid('wc'), workerId, date, timeIn:'', timeOut:''};
    workCardEntries.push(e);
  }
  e[field] = value;
  if(!e.timeIn && !e.timeOut){
    // Both cleared - drop the record entirely, matching toolboxRecords' lazy-creation philosophy.
    workCardEntries = workCardEntries.filter(x=>x.id!==e.id);
  }
  saveAll();
}
function timeToMinutes(hhmm){
  if(!hhmm) return null;
  const parts = hhmm.split(':');
  if(parts.length!==2) return null;
  const h = +parts[0], m = +parts[1];
  if(isNaN(h)||isNaN(m)) return null;
  return h*60+m;
}
/* "ימים" counts a day the worker logged a check-in (mirrors the reference spreadsheet's own
   COUNT-of-checkin-column convention) even if the check-out was forgotten that day. "סה"כ שעות"
   only sums days where BOTH times exist and checkout is after checkin - deliberately more
   careful than the reference sheet, which would silently subtract a lone check-in from the
   total with nothing to balance it. */
function computeWorkCardTotals(workerId, month){
  const numDays = toolboxDaysInMonth(month);
  let days = 0, minutes = 0;
  for(let d=1; d<=numDays; d++){
    const date = `${month}-${String(d).padStart(2,'0')}`;
    const e = workCardEntry(workerId, date);
    if(!e) continue;
    if(e.timeIn) days++;
    const inM = timeToMinutes(e.timeIn), outM = timeToMinutes(e.timeOut);
    if(inM!==null && outM!==null && outM>inM){ minutes += (outM-inM); }
  }
  return {days, hours: minutes/60};
}

  }

  contractorEl.onchange = e=>{
    wcContractorId = e.target.value; wcCrewId = ''; wcWorkerId = '';

        <table><thead><tr><th>יום</th><th>כניסה</th><th>יציאה</th></tr></thead><tbody>${printRows(1, halfSplit)}</tbody></table>

      <div class="row-actions" style="align-items:flex-end;"><button class="btn secondary" id="wc_pdf">ייצוא ל-PDF (הדפסה)</button></div>
    </div>
  `;

  document.getElementById('wc_month').onchange = e=>{ if(e.target.value){ wcMonth = e.target.value; renderWorkCardGrid(); } };
  document.getElementById('wc_pdf').onclick = ()=> window.print();
  body.querySelectorAll('.wc_in').forEach(el=>{
    el.onchange = e=>{ setWorkCardTime(w.id, e.target.dataset.date, 'timeIn', e.target.value); recomputeWorkCardTotals(w.id); };
  });
  body.querySelectorAll('.wc_out').forEach(el=>{
    el.onchange = e=>{ setWorkCardTime(w.id, e.target.dataset.date, 'timeOut', e.target.value); recomputeWorkCardTotals(w.id); };
  });
  recomputeWorkCardTotals(w.id);
}
function recomputeWorkCardTotals(workerId){
  const totals = computeWorkCardTotals(workerId, wcMonth);
  const daysEl = document.getElementById('wc_totalDays');
  const hoursEl = document.getElementById('wc_totalHours');
  if(daysEl) daysEl.textContent = totals.days;
  if(hoursEl) hoursEl.textContent = (Math.round(totals.hours*100)/100).toString();
}

      if(pid && l.projectId!==pid) return false;

      </div>`;

      b.onclick = ()=>{ activeTab='dailylog'; renderNav(); document.getElementById('app').innerHTML=''; renderDailyLog(document.getElementById('app'), b.dataset.id); };
    });
    box.querySelectorAll('.toggle-delete-btn').forEach(b=>{
      b.onclick = ()=>{
        const log = logs.find(x=>x.id===b.dataset.id);
        if(!log) return;
        if(!log.deleted){
          if(!confirm(`לסמן את היומן מתאריך ${fmtDate(log.date)} כמבוטל? הרשומה תישאר בתיעוד, אך תוצג עם קו חוצה על כל התוכן ולא תיכלל בדוחות.`)) return;
        }
        log.deleted = !log.deleted;
        saveAll();
        doSearch();
      };
    });
    box.querySelectorAll('.log-select-cb').forEach(cb=>{
      cb.onchange = e=>{
        const id = e.target.dataset.id;
        if(e.target.checked) selectedLogIds.add(id); else selectedLogIds.delete(id);
        syncSelectAllState();
        updateBatchPrintBar();
      };
    });
    syncSelectAllState();
    updateBatchPrintBar();

    function syncSelectAllState(){
      const selectAllCb = document.getElementById('s_selectAll');
      if(!selectAllCb) return;
      const ids = results.map(l=>l.id);
      selectAllCb.checked = ids.length>0 && ids.every(id=>selectedLogIds.has(id));
    }
  }

  document.getElementById('s_selectAll').onchange = e=>{
    const box = document.getElementById('s_results');
    box.querySelectorAll('.log-select-cb').forEach(cb=>{
      cb.checked = e.target.checked;
      if(e.target.checked) selectedLogIds.add(cb.dataset.id); else selectedLogIds.delete(cb.dataset.id);

/* ---- Retroactively adding a forgotten contractor's attendance across a date range (section 7.1) -
   e.g. a crane operator or occasional worker who "didn't seem important enough" to log at the
   time, then turned out to matter after all. Only ever touches EXISTING logs (never creates a
   log for a missing date - that would silently create a mostly-empty log with no weather/content,
   which is a bigger decision than "add one contractor"), and per explicit user request, silently
   skips any date whose log already has an attendance row for that contractor - never duplicates
   or overwrites. */
function renderBulkAttendanceTool(main){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>תיקון תאריכים לקבלן ⭐</h2>
    <div class="note">לשימוש כשמגלים שקבלן (למשל מנופאי או עובד מזדמן) לא נרשם בנוכחות היומן היומי במשך כמה ימים ברצף. מוסיף שורת נוכחות + מספר פועלים לכל יומן ש<b>כבר קיים</b> בטווח - לא יוצר יומנים חדשים, ומדלג אוטומטית על תאריך שבו הקבלן כבר מופיע בנוכחות (לא כותב פעמיים).</div>
    <div class="grid grid-4">
      <div class="field"><label>קבלן משנה *</label>
        <select id="ba_contractor" class="searchable"><option value="">בחר קבלן...</option>${sortContractorsAlpha(contractors).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>פרויקט *</label>
        <select id="ba_project" class="searchable"><option value="">בחר פרויקט...</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>
      </div>
      <div class="field"><label>תת-פרויקט</label><select id="ba_subproject"><option value="">ללא תת-פרויקט</option></select></div>
      <div class="field"><label>מספר פועלים (ברירת מחדל לכל הימים)</label><input type="number" id="ba_defaultWorkers" min="0" step="1" value="1"></div>
      <div class="field"><label>מתאריך *</label><input type="date" id="ba_from"></div>
      <div class="field"><label>עד תאריך *</label><input type="date" id="ba_to"></div>
    </div>
    <button class="btn secondary" id="ba_load">טען תאריכים</button>
    <div id="ba_rows" style="margin-top:10px;"></div>
  `;
  main.appendChild(card);

  const projectEl = document.getElementById('ba_project');
  const subProjectEl = document.getElementById('ba_subproject');
  projectEl.onchange = ()=>{
    const opts = sortSubProjectsAlpha(subProjects.filter(sp=>sp.projectId===projectEl.value));
    subProjectEl.innerHTML = '<option value="">ללא תת-פרויקט</option>' + opts.map(sp=>`<option value="${sp.id}">${esc(sp.name)}</option>`).join('');
  };

  document.getElementById('ba_load').onclick = ()=>{
    const contractorId = document.getElementById('ba_contractor').value;
    const projectId = projectEl.value;
    const subProjectId = subProjectEl.value;
    const from = document.getElementById('ba_from').value;
    const to = document.getElementById('ba_to').value;
    const defaultWorkers = document.getElementById('ba_defaultWorkers').value;
    const rowsBox = document.getElementById('ba_rows');
    if(!contractorId || !projectId || !from || !to){ toast('נא למלא קבלן, פרויקט, ומתאריך/עד תאריך'); return; }
    if(from > to){ toast('"מתאריך" צריך להיות לפני "עד תאריך"'); return; }
    const dates = datesInRange(from, to);
    if(dates.length > 366){ toast('הטווח גדול מדי (מעל שנה) - נא לצמצם'); return; }

    const rowsHtml = dates.map(date=>{
      const dow = HEBREW_WEEKDAY_SHORT[new Date(date+'T00:00:00').getDay()];
      const log = logs.find(l=> l.projectId===projectId && (l.subProjectId||'')===(subProjectId||'') && l.date===date && !l.deleted);
      let statusHtml, inputHtml;
      if(!log){
        statusHtml = '<span class="badge gray">אין יומן לתאריך זה</span>';
        inputHtml = '—';
      } else if((log.attendance||[]).some(a=>a.contractorId===contractorId)){
        statusHtml = '<span class="badge gray">הקבלן כבר רשום - דולג</span>';
        inputHtml = '—';
      } else {
        statusHtml = '<span class="badge ok">יומן קיים - מוכן להוספה</span>';
        inputHtml = `<input type="number" class="ba_workers" data-log-id="${log.id}" min="0" step="1" value="${esc(defaultWorkers)}" style="width:80px;">`;
      }
      return `<tr><td>${fmtDate(date)}</td><td>${dow}</td><td>${statusHtml}</td><td>${inputHtml}</td></tr>`;
    }).join('');

    rowsBox.innerHTML = `
      <table class="log-table">
        <thead><tr><th>תאריך</th><th>יום</th><th>סטטוס</th><th>מספר פועלים</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
      <button class="btn" id="ba_apply" style="margin-top:10px;">הוסף נוכחות לכל התאריכים המוכנים</button>
    `;

    document.getElementById('ba_apply').onclick = ()=>{
      let added = 0;
      rowsBox.querySelectorAll('.ba_workers').forEach(input=>{
        const logId = input.dataset.logId;
        const log = logs.find(l=>l.id===logId);
        if(!log) return;
        // Re-check at write time (not just at load time) - the same log could have been edited
        // (e.g. in another tab) since the list was loaded, and this must never add a duplicate.
        if((log.attendance||[]).some(a=>a.contractorId===contractorId)) return;
        log.attendance = log.attendance || [];
        log.attendance.push({contractorId, workers: input.value, crewId:''});
        added++;
      });
      if(added>0) saveAll();
      toast(added>0 ? `נוספה נוכחות ל-${added} יומנים` : 'לא נוספה נוכחות - כל התאריכים כבר טופלו');
      document.getElementById('ba_load').click(); // refresh the list so applied rows show as "already registered"
    };
  };
}
function datesInRange(from, to){
  // Built from local Y/M/D getters (not toISOString, which converts to UTC and would shift
  // every date back by one in any timezone ahead of UTC, e.g. Israel - verified this the hard
  // way while testing).
  const out = [];
  const d = new Date(from+'T00:00:00');
  const end = new Date(to+'T00:00:00');
  while(d <= end){
    out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
    d.setDate(d.getDate()+1);
  }
  return out;
}

    const titleParts = [`דוח נוכחות פועלים: ${contractor?contractor.name:''}`];
    if(specificCrew) titleParts.push(specificCrew.name);
    if(pid){ const p = projects.find(x=>x.id===pid); if(p) titleParts.push(p.name); }
    titleBox.textContent = titleParts.join(' - ');

    let rows = [];
    toolboxRecords
      .filter(t=> !pid || t.projectId===pid)
      .filter(t=> !from || t.date>=from)
      .filter(t=> !to || t.date<=to)
      .forEach(t=>{
        (t.presentWorkerIds||[]).forEach(wid=>{
          const w = workers.find(x=>x.id===wid);
          if(!w) return;
          // Historical crew as of this specific date - a worker later transferred to another
          // crew still shows past days under whichever crew was actually true back then.
          const histCrewId = crewIdAtDate(w.id, t.date);
          const cr = crews.find(x=>x.id===histCrewId);
          if(!cr || cr.contractorId!==contractorId) return;
          if(crewId && histCrewId!==crewId) return;
          rows.push({date:t.date, crewName: cr?cr.name:'—', workerName: w.name||'—', idNumber: w.idNumber||''});
        });
      });
    rows.sort((a,b)=> a.date.localeCompare(b.date));

    if(rows.length===0){ box.innerHTML = '<div class="empty">לא נמצאו רישומי נוכחות פועלים התואמים לסינון.</div>'; return; }

    // Split into a separate table per crew (instead of one merged table with a crew column),
    // so each crew's attendance reads as its own self-contained block.
    const byCrew = new Map();
    rows.forEach(r=>{
      if(!byCrew.has(r.crewName)) byCrew.set(r.crewName, []);
      byCrew.get(r.crewName).push(r);
    });
    const crewNames = Array.from(byCrew.keys()).sort((a,b)=> a.localeCompare(b, 'he', {numeric:true, sensitivity:'base'}));

    let detailHtml = '';
    let summaryHtml = '';
    crewNames.forEach(crewName=>{
      const crewRows = byCrew.get(crewName).slice().sort((a,b)=> a.date.localeCompare(b.date));

      // Detail: group by date within this crew so same-day entries share a rowspan cell.
      const dateGroups = [];
      const byDate = new Map();
      crewRows.forEach(r=>{
        let g = byDate.get(r.date);
        if(!g){ g = {date:r.date, rows:[]}; byDate.set(r.date, g); dateGroups.push(g); }
        g.rows.push(r);
      });
      let bodyHtml = '';
      dateGroups.forEach(g=>{
        g.rows.forEach((r,pos)=>{
          bodyHtml += '<tr>';
          if(pos===0){ bodyHtml += `<td rowspan="${g.rows.length}">${fmtDate(g.date)}</td>`; }
          bodyHtml += `<td>${esc(r.workerName)}</td><td>${esc(r.idNumber)}</td></tr>`;
        });
      });
      detailHtml += `
        <h3 style="margin-top:14px; font-size:13.5px; color:var(--navy);">קבוצה: ${esc(crewName)}</h3>
        <table><thead><tr><th>תאריך</th><th>פועל</th><th>ת.ז / דרכון</th></tr></thead><tbody>${bodyHtml}</tbody></table>
      `;

      // Summary for this crew: distinct attendance-days per worker.
      const byWorker = {};
      crewRows.forEach(r=>{
        const key = r.idNumber || r.workerName;
        if(!byWorker[key]) byWorker[key] = {workerName:r.workerName, idNumber:r.idNumber, dates:new Set()};
        byWorker[key].dates.add(r.date);
      });
      const summaryRows = Object.values(byWorker)
        .sort((a,b)=> a.workerName.localeCompare(b.workerName, 'he', {numeric:true, sensitivity:'base'}))
        .map(w=>`<tr><td>${esc(w.workerName)}</td><td>${esc(w.idNumber)}</td><td>${w.dates.size}</td></tr>`).join('');
      summaryHtml += `
        <h4 style="margin-top:12px; font-size:12.5px; color:var(--navy-dark);">קבוצה: ${esc(crewName)}</h4>
        <table><thead><tr><th>פועל</th><th>ת.ז / דרכון</th><th>סה"כ ימי נוכחות</th></tr></thead><tbody>${summaryRows}</tbody></table>
      `;
    });

    box.innerHTML = detailHtml;
    summaryBox.innerHTML = `<h3 style="font-size:14px; color:var(--navy-dark);">סיכום נוכחות לכל פועל</h3>${summaryHtml}`;
  }
}

  main.appendChild(card);

  const rProjectEl = document.getElementById('r_project');
  const rSubProjectEl = document.getElementById('r_subproject');
  rProjectEl.onchange = ()=>{
    const opts = sortSubProjectsAlpha(subProjects.filter(sp=>sp.projectId===rProjectEl.value));
    rSubProjectEl.innerHTML = '<option value="">הכל</option>' + opts.map(sp=>`<option value="${sp.id}">${esc(sp.name)}</option>`).join('');
  };

  let lastRows = [];
  document.getElementById('r_go').onclick = buildReport;
  document.getElementById('r_csv').onclick = ()=> exportCSV(lastRows);
  document.getElementById('r_pdf').onclick = ()=> window.print();
  buildReport();

  function buildReport(){
    const pid = rProjectEl.value;
    const subProjId = rSubProjectEl.value;
    const from = document.getElementById('r_from').value;
    const to = document.getElementById('r_to').value;
    const filtered = logs.filter(l=>{
      if(l.deleted) return false;
      if(pid && l.projectId!==pid) return false;
      if(subProjId && l.subProjectId!==subProjId) return false;
      if(from && l.date < from) return false;
      if(to && l.date > to) return false;
      return true;
    });
    const byContractor = {};
    filtered.forEach(l=>{
      (l.attendance||[]).forEach(a=>{
        if(!a.contractorId) return;
        const c = contractors.find(x=>x.id===a.contractorId);
        const name = c ? c.name : '(קבלן לא ידוע)';
        if(!byContractor[name]) byContractor[name] = {days:0, workers:0};
        byContractor[name].days += 1;
        byContractor[name].workers += Number(a.workers)||0;
      });
    });
    lastRows = Object.entries(byContractor).map(([name,v])=>({name, days:v.days, workers:v.workers}));
    const box = document.getElementById('r_table');
    if(lastRows.length===0){ box.innerHTML = '<div class="empty">אין נתונים בטווח שנבחר.</div>'; return; }
    box.innerHTML = `
      <table>
        <thead><tr><th>קבלן משנה</th><th>ימי עבודה בטווח</th><th>סה"כ פועלים (מצטבר)</th></tr></thead>
        <tbody>
          ${lastRows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.days}</td><td>${r.workers}</td></tr>`).join('')}
        </tbody>
      </table>
    `;
  }

  function exportCSV(rows){
    if(!rows.length){ toast('אין נתונים לייצוא'); return; }
    const header = 'קבלן משנה,ימי עבודה,סה"כ פועלים\n';
    const body = rows.map(r=>`${r.name},${r.days},${r.workers}`).join('\n');
    const csv = '\uFEFF' + header + body; // BOM for Hebrew in Excel
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `דוח-נוכחות-${todayStr()}.csv`;
    a.click();
  }
}

  const r5SubProjectEl = document.getElementById('r5_subproject');
  r5ProjectEl.onchange = ()=>{
    const spOpts = sortSubProjectsAlpha(subProjects.filter(sp=>sp.projectId===r5ProjectEl.value));
    r5SubProjectEl.innerHTML = '<option value="">הכל</option>' + spOpts.map(sp=>`<option value="${sp.id}">${esc(sp.name)}</option>`).join('');
  };
  document.getElementById('r5_go').onclick = buildDailyWorkReport;
  document.getElementById('r5_pdf').onclick = ()=> window.print();

  function buildDailyWorkReport(){
    const pid = r5ProjectEl.value;
    const contractorId = r5ContractorEl.value;
    const subProjId = r5SubProjectEl.value;
    const from = document.getElementById('r5_from').value;
    const to = document.getElementById('r5_to').value;
    const box = document.getElementById('r5_table');
    const summaryBox = document.getElementById('r5_summary');
    const titleBox = document.getElementById('r5_title');
    titleBox.textContent = '';
    summaryBox.innerHTML = '';
    if(!pid){ box.innerHTML = '<div class="empty">יש לבחור פרויקט כדי להפיק את הדוח.</div>'; return; }

    let rows = [];
    logs.filter(l=>l.projectId===pid && !l.deleted)
      .filter(l=> !subProjId || l.subProjectId===subProjId)
      .filter(l=> !from || l.date>=from)
      .filter(l=> !to || l.date<=to)
      .forEach(l=>{
        (l.dailyWork||[]).forEach(dw=>{
          if(contractorId && dw.contractorId!==contractorId) return;
          const c = dw.contractorId ? contractors.find(x=>x.id===dw.contractorId) : null;
          rows.push({
            date: l.date, subProject: subProjectText(l), contractor: c?c.name:'—',
            days: Number(dw.days)||0, hours: Number(dw.hours)||0,
            description: dw.description||''
          });
        });
      });
    rows.sort((a,b)=> a.date.localeCompare(b.date));

    if(rows.length===0){ box.innerHTML = '<div class="empty">לא נמצאו רישומי יומיות התואמים לסינון.</div>'; return; }

    const specificContractor = contractorId ? contractors.find(c=>c.id===contractorId) : null;
    const specificSubProject = subProjId ? subProjects.find(sp=>sp.id===subProjId) : null;
    if(specificContractor || specificSubProject){
      const proj = projects.find(p=>p.id===pid);
      const parts = [`דוח פירוט יומיות: ${proj?proj.name:''}`];
      if(specificSubProject) parts.push(specificSubProject.name);
      if(specificContractor) parts.push(specificContractor.name);
      titleBox.textContent = parts.join(' - ');
    }
    const showContractorColumn = !specificContractor;
    const showSubProjectColumn = !specificSubProject && subProjects.some(sp=>sp.projectId===pid);

    // Group by date so same-day entries share a single merged (rowspan) date cell.
    const dateGroups = [];
    const byDate = new Map();
    rows.forEach(r=>{
      let g = byDate.get(r.date);
      if(!g){ g = {date:r.date, rows:[]}; byDate.set(r.date, g); dateGroups.push(g); }
      g.rows.push(r);
    });

    let bodyHtml = '';
    dateGroups.forEach(g=>{
      g.rows.forEach((r,pos)=>{
        bodyHtml += '<tr>';
        if(pos===0){ bodyHtml += `<td rowspan="${g.rows.length}">${fmtDate(g.date)}</td>`; }
        if(showSubProjectColumn){ bodyHtml += `<td>${esc(r.subProject||'—')}</td>`; }
        if(showContractorColumn){ bodyHtml += `<td>${esc(r.contractor)}</td>`; }
        bodyHtml += `<td>${r.days||''}</td><td>${r.hours||''}</td><td>${esc(r.description)}</td></tr>`;
      });
    });
    const headerCols = `<th>תאריך</th>${showSubProjectColumn?'<th>תת-פרויקט</th>':''}${showContractorColumn?'<th>קבלן</th>':''}<th>ימי עבודה</th><th>שעות עבודה</th><th>פירוט המשימה</th>`;
    box.innerHTML = `<table><thead><tr>${headerCols}</tr></thead><tbody>${bodyHtml}</tbody></table>`;

    // Summary: total days/hours per contractor, for payment reconciliation.
    const byContractor = {};
    rows.forEach(r=>{
      if(!byContractor[r.contractor]) byContractor[r.contractor] = {days:0, hours:0};
      byContractor[r.contractor].days += r.days;
      byContractor[r.contractor].hours += r.hours;
    });
    const summaryRows = Object.entries(byContractor).map(([name,v])=>`<tr><td>${esc(name)}</td><td>${v.days}</td><td>${v.hours}</td></tr>`).join('');
    summaryBox.innerHTML = `
      <h3 style="font-size:14px; color:var(--navy-dark);">סיכום לתשלום</h3>
      <table><thead><tr><th>קבלן</th><th>סה"כ ימי עבודה</th><th>סה"כ שעות עבודה</th></tr></thead><tbody>${summaryRows}</tbody></table>
    `;
  }
}

/* ---- Report: contractor dossier - every category of data recorded for ONE contractor
   (attendance, day-rate work, execution, exceptions, planning) across a date range,
   in one place. For a periodic settlement/review with a specific subcontractor. ---- */
function renderContractorReport(main){
  const card6 = document.createElement('div');
  card6.className='card';
  card6.innerHTML = `
    ${buildPrintHeader()}
    <h2>דוח נתוני קבלן</h2>
    <div class="note">ריכוז כל הנתונים הקיימים ביומנים עבור קבלן ספציפי, לאורך טווח תאריכים: נוכחות, יומיות, תיעוד ביצוע, חריגים ותכנון - הכל במקום אחד.</div>
    <div class="searchbar">
      <div><label>קבלן משנה *</label><select id="r6_contractor" class="searchable"><option value="">בחר קבלן...</option>${sortContractorsAlpha(contractors).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      <div><label>פרויקט</label><select id="r6_project" class="searchable"><option value="">כל הפרויקטים</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div><label>מתאריך</label><input type="date" id="r6_from"></div>
      <div><label>עד תאריך</label><input type="date" id="r6_to"></div>
    </div>
    <div class="row-actions">
      <button class="btn" id="r6_go">הפק דוח</button>
      <button class="btn secondary" id="r6_pdf">ייצוא ל-PDF (הדפסה)</button>
    </div>
    <div id="r6_output" style="margin-top:12px;"></div>
  `;
  main.appendChild(card6);

  document.getElementById('r6_go').onclick = buildContractorReport;
  document.getElementById('r6_pdf').onclick = ()=> window.print();

  function simpleTable(rows, cols){
    if(rows.length===0) return '<div class="empty">אין נתונים בטווח שנבחר.</div>';
    const headerCols = cols.map(c=>`<th>${c.label}</th>`).join('');
    const bodyRows = rows.map(r=>`<tr>${cols.map(c=>`<td>${c.render?c.render(r):esc(r[c.key]||'')}</td>`).join('')}</tr>`).join('');
    return `<table><thead><tr>${headerCols}</tr></thead><tbody>${bodyRows}</tbody></table>`;
  }

  function buildContractorReport(){
    const contractorId = document.getElementById('r6_contractor').value;
    const pid = document.getElementById('r6_project').value;
    const from = document.getElementById('r6_from').value;
    const to = document.getElementById('r6_to').value;
    const out = document.getElementById('r6_output');
    if(!contractorId){ out.innerHTML = '<div class="empty">יש לבחור קבלן כדי להפיק את הדוח.</div>'; return; }
    const contractor = contractors.find(c=>c.id===contractorId);

    const filteredLogs = logs.filter(l=>!l.deleted)
      .filter(l=> !pid || l.projectId===pid)
      .filter(l=> !from || l.date>=from)
      .filter(l=> !to || l.date<=to)
      .sort((a,b)=> a.date.localeCompare(b.date));

    const showProjectColumn = !pid;
    const projName = l=>{ const p = projects.find(x=>x.id===l.projectId); return p?p.name:'—'; };
    const dateCol = {key:'date', label:'תאריך', render:r=>fmtDate(r.date)};
    const projCol = {key:'project', label:'פרויקט'};
    const baseCols = showProjectColumn ? [dateCol, projCol] : [dateCol];

    let attendanceRows = [], dwRows = [], execRows = [], excRows = [], planRows = [];
    filteredLogs.forEach(l=>{
      (l.attendance||[]).forEach(a=>{
        if(a.contractorId===contractorId) attendanceRows.push({date:l.date, project:projName(l), workers:Number(a.workers)||0});
      });
      (l.dailyWork||[]).forEach(dw=>{
        if(dw.contractorId===contractorId) dwRows.push({date:l.date, project:projName(l), days:Number(dw.days)||0, hours:Number(dw.hours)||0, description:dw.description||''});
      });
      (l.execution||[]).forEach(ex=>{
        if(ex.contractorId===contractorId) execRows.push({date:l.date, project:projName(l), location:execLocationText(ex), description:ex.description||''});
      });
      normalizeContractorRows(l.exceptions).forEach(exc=>{
        if(exc.contractorId===contractorId) excRows.push({date:l.date, project:projName(l), description:exc.description||''});
      });
      normalizeContractorRows(l.planning).forEach(pl=>{
        if(pl.contractorId===contractorId) planRows.push({date:l.date, project:projName(l), description:pl.description||''});
      });
    });

    const attendanceWorkersTotal = attendanceRows.reduce((s,r)=>s+r.workers,0);
    const dwDaysTotal = dwRows.reduce((s,r)=>s+r.days,0);
    const dwHoursTotal = dwRows.reduce((s,r)=>s+r.hours,0);
    const hasAnyData = attendanceRows.length || dwRows.length || execRows.length || excRows.length || planRows.length;

    const titleParts = [`דוח נתוני קבלן: ${contractor?contractor.name:''}`];
    if(pid){ const p = projects.find(x=>x.id===pid); if(p) titleParts.push(p.name); }
    if(from || to) titleParts.push(`${from?fmtDate(from):'—'} עד ${to?fmtDate(to):'—'}`);

    out.innerHTML = `
      <div style="font-weight:bold; color:var(--navy-dark); font-size:14px; margin-bottom:10px;">${esc(titleParts.join(' · '))}</div>
      ${!hasAnyData?'<div class="empty">לא נמצאו נתונים כלשהם עבור קבלן זה בטווח שנבחר.</div>':''}

      <h3>סיכום נוכחות</h3>
      <div class="note">${attendanceRows.length} ימי נוכחות · ${attendanceWorkersTotal} סה"כ פועלים (מצטבר)</div>
      ${simpleTable(attendanceRows, [...baseCols, {key:'workers',label:'מספר פועלים'}])}

      <h3 style="margin-top:16px;">יומיות</h3>
      <div class="note">${dwDaysTotal} סה"כ ימי עבודה · ${dwHoursTotal} סה"כ שעות עבודה</div>
      ${simpleTable(dwRows, [...baseCols, {key:'days',label:'ימי עבודה'}, {key:'hours',label:'שעות עבודה'}, {key:'description',label:'פירוט המשימה'}])}

      <h3 style="margin-top:16px;">תיעוד ביצוע</h3>
      ${simpleTable(execRows, [...baseCols, {key:'location',label:'מיקום'}, {key:'description',label:'תיאור'}])}

      <h3 style="margin-top:16px;">חריגים</h3>
      ${simpleTable(excRows, [...baseCols, {key:'description',label:'תיאור'}])}

      <h3 style="margin-top:16px;">תכנון</h3>
      ${simpleTable(planRows, [...baseCols, {key:'description',label:'תיאור'}])}
    `;
  }
}

/* ---- Report: read-only printout of a project+month toolbox matrix (section 8.8), optionally
   narrowed to one contractor and/or crew - reuses buildToolboxMatrixData (section 4.2) so the
   crew-transfer/inactive-worker logic can't drift from the live interactive matrix. Cells show
   a plain ✓ instead of a checkbox (nothing here is editable) and totals are computed directly
   rather than read back from the DOM, since there's no live checkbox state to recompute from. ---- */
function renderToolboxMatrixReport(main){
  const card8 = document.createElement('div');
  card8.className = 'card';
  const printableContractors = sortContractorsAlpha(contractors.filter(c=>crewsForContractor(c.id).length>0));
  card8.innerHTML = `
    ${buildPrintHeader()}
    <h2>דוח מטריצת טולבוקס</h2>
    <div class="note">תצוגה לעיון/הדפסה של מטריצת הנוכחות מטאב "טולבוקס" - לפי פרויקט וחודש, עם צמצום אופציונלי לקבלן ו/או קבוצה ספציפיים.</div>
    ${printableContractors.length===0?'<div class="empty">אין עדיין קבלנים עם קבוצות עבודה ופועלים מוגדרים (טאב "קבלני משנה").</div>':`
    <div class="searchbar">
      <div><label>פרויקט *</label><select id="r8_project" class="searchable"><option value="">בחר פרויקט...</option>${projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
      <div><label>חודש *</label><input type="month" id="r8_month" value="${todayStr().slice(0,7)}"></div>
      <div><label>קבלן משנה</label><select id="r8_contractor" class="searchable"><option value="">כל הקבלנים</option>${printableContractors.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div>
      <div><label>קבוצה</label><select id="r8_crew" class="searchable"><option value="">כל הקבוצות</option></select></div>
    </div>
    <div class="row-actions">
      <button class="btn" id="r8_go">הפק דוח</button>
      <button class="btn secondary" id="r8_pdf">ייצוא ל-PDF (הדפסה)</button>
    </div>
    <div id="r8_title" style="margin-top:10px; font-weight:bold; color:var(--navy-dark); font-size:14px;"></div>
    <div id="r8_table" style="margin-top:8px;"></div>
    `}
  `;
  main.appendChild(card8);
  if(printableContractors.length===0) return;

  const r8ContractorEl = document.getElementById('r8_contractor');
  const r8CrewEl = document.getElementById('r8_crew');
  r8ContractorEl.onchange = ()=>{
    const crewOpts = r8ContractorEl.value ? sortCrewsAlpha(crewsForContractor(r8ContractorEl.value)) : [];
    r8CrewEl.innerHTML = '<option value="">כל הקבוצות</option>' + crewOpts.map(cr=>`<option value="${cr.id}">${esc(cr.name)}</option>`).join('');
  };
  document.getElementById('r8_go').onclick = buildToolboxMatrixReportTable;
  document.getElementById('r8_pdf').onclick = ()=> window.print();

  function buildToolboxMatrixReportTable(){
    const projectId = document.getElementById('r8_project').value;
    const month = document.getElementById('r8_month').value;
    const contractorId = r8ContractorEl.value;
    const crewId = r8CrewEl.value;
    const titleBox = document.getElementById('r8_title');
    const box = document.getElementById('r8_table');
    if(!projectId || !month){ box.innerHTML = '<div class="empty">יש לבחור פרויקט וחודש כדי להפיק את הדוח.</div>'; titleBox.textContent=''; return; }

    const proj = projects.find(p=>p.id===projectId);
    const titleParts = [`דוח מטריצת טולבוקס: ${proj?proj.name:''}`, month];
    if(contractorId){ const c = contractors.find(x=>x.id===contractorId); if(c) titleParts.push(c.name); }
    if(crewId){ const cr = crews.find(x=>x.id===crewId); if(cr) titleParts.push(cr.name); }
    titleBox.textContent = titleParts.join(' - ');

    const {days, presenceByDay, contractorBlocks} = buildToolboxMatrixData(projectId, month, contractorId, crewId);
    if(contractorBlocks.length===0){ box.innerHTML = '<div class="empty">אין נתוני נוכחות תואמים לסינון שנבחר.</div>'; return; }
    const saturdays = new Set(days.filter(d=> new Date(month+'-'+String(d).padStart(2,'0')+'T00:00:00').getDay()===6));

    const dayHeaderCells = days.map(d=>{
      const dow = HEBREW_WEEKDAY_SHORT[new Date(month+'-'+String(d).padStart(2,'0')+'T00:00:00').getDay()];
      return `<th class="tbx-day-header${saturdays.has(d)?' tbx-saturday':''}"><div>${d}</div><div class="tbx-dow">${dow}</div></th>`;
    }).join('');

    const dayTotals = {}; days.forEach(d=> dayTotals[d]=0);
    let grand = 0;
    let rowsHtml = '';
    contractorBlocks.forEach(({contractor:c, crewBlocks})=>{
      crewBlocks.forEach(({crew:cr, rows})=>{
        rowsHtml += `<tr class="tbx-group-row"><td colspan="${days.length+4}">${esc(c.name)} - ${esc(cr.name)}${cr.description?(' ('+esc(cr.description)+')'):''}</td></tr>`;
        const crewDayTotals = {}; days.forEach(d=> crewDayTotals[d]=0);
        let crewGrand = 0;
        rows.forEach(({worker:w, validDays}, idx)=>{
          let rowTotal = 0;
          let cells = '';
          days.forEach(d=>{
            const satCls = saturdays.has(d) ? ' tbx-saturday' : '';
            if(validDays.has(d)){
              const present = presenceByDay[d].has(w.id);
              if(present){ rowTotal++; dayTotals[d]++; crewDayTotals[d]++; }
              cells += `<td class="tbx-cell${satCls}">${present?'✓':''}</td>`;
            } else {
              cells += `<td class="tbx-cell tbx-cell-na${satCls}">—</td>`;
            }
          });
          grand += rowTotal; crewGrand += rowTotal;
          rowsHtml += `<tr><td class="tbx-serial-cell">${idx+1}</td><td class="tbx-id-cell">${esc(w.idNumber||'—')}</td><td class="tbx-name-cell">${esc(w.name||'')}</td>${cells}<td class="tbx-total-cell">${rowTotal}</td></tr>`;
        });
        const crewDayCells = days.map(d=>`<td class="tbx-crew-day-total${saturdays.has(d)?' tbx-saturday':''}">${crewDayTotals[d]}</td>`).join('');
        rowsHtml += `<tr class="tbx-crew-subtotal-row"><td class="tbx-serial-cell"></td><td class="tbx-id-cell"></td><td class="tbx-name-cell">סה"כ קבוצה</td>${crewDayCells}<td class="tbx-crew-grand-total">${crewGrand}</td></tr>`;
      });
    });
    const footerDayCells = days.map(d=>`<td class="tbx-day-footer${saturdays.has(d)?' tbx-saturday':''}">${dayTotals[d]}</td>`).join('');

    box.innerHTML = `
      <div class="tbx-matrix-wrap">
        <table class="tbx-matrix">
          <thead><tr><th class="tbx-serial-cell">מס"ד</th><th class="tbx-id-cell">ת.ז / דרכון</th><th class="tbx-name-cell">שם</th>${dayHeaderCells}<th>סה"כ</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
          <tfoot><tr><td class="tbx-serial-cell"></td><td class="tbx-id-cell"></td><td class="tbx-name-cell">פועלים ליום</td>${footerDayCells}<td>${grand}</td></tr></tfoot>
        </table>
      </div>
      <div class="note" style="margin-top:6px;">תא עם "—" - הפועל לא היה משויך לקבוצה זו באותו תאריך (לפי היסטוריית שיוך הקבוצות שלו).</div>
    `;
  }
}

/* ===================== NEW: Settings (company profile) + REQ-013: Backup / Restore ===================== */
function renderSettings(main){
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `
    <h2>פרטי החברה המנהלת</h2>
    <div class="note">הפרטים הבאים יופיעו אוטומטית בראש כל יומן ותיק מיקום מודפסים.</div>
    <div class="grid">
      <div class="field"><label>שם החברה</label><input id="co_name" value="${esc(company.name||'')}"></div>
      <div class="field"><label>מספר רישיון קבלן / ח.פ</label><input id="co_license" value="${esc(company.license||'')}"></div>
    </div>
    <div class="field"><label>לוגו החברה</label>
      <input type="file" id="co_logo" accept="image/*">
      <div class="hint">הלוגו נדחס ונשמר מקומית בדפדפן בלבד.</div>
      ${company.logoDataUrl?`<div style="margin-top:8px; display:flex; align-items:center; gap:10px;"><img src="${company.logoDataUrl}" style="height:60px; border:1px solid var(--border); border-radius:6px;"><button class="btn danger small" id="co_logo_rm">הסר לוגו</button></div>`:''}
    </div>
    <div class="row-actions"><button class="btn" id="co_save">שמור פרטי חברה</button></div>

  main.appendChild(card);

  document.getElementById('co_save').onclick = ()=>{
    company.name = document.getElementById('co_name').value.trim();
    company.license = document.getElementById('co_license').value.trim();

  document.getElementById('co_logo').onchange = async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    company.logoDataUrl = await compressImage(file, 300, 0.8);
    saveAll(); toast('הלוגו נשמר'); render();

  const rmBtn = document.getElementById('co_logo_rm');
  if(rmBtn){ rmBtn.onclick = ()=>{ company.logoDataUrl=''; saveAll(); toast('הלוגו הוסר'); render(); }; }

  renderBackupSection(main);
}

function renderBackupSection(main){
  const card = document.createElement('div');
  card.className='card';
  card.innerHTML = `
    <h2>גיבוי ושחזור נתונים</h2>
    <div class="note">הנתונים בגרסה זו נשמרים אוטומטית ב-Google Drive שלך (ראו הסטטוס ליד הכותרת למעלה). כלי הגיבוי כאן משמש להורדת עותק מקומי נוסף לביטחון, או לייבוא נתונים ישנים ממכשיר/גרסה אחרת.</div>
    <div class="row-actions">
      <button class="btn" id="b_export">ייצוא גיבוי מלא</button>
    </div>
    <h3 style="margin-top:22px;">טעינת נתונים מקובץ גיבוי</h3>
    <input type="file" id="b_file" accept="application/json">
    <div class="field" style="margin-top:12px;">
      <label>אופן הטעינה</label>
      <select id="b_mode">
        <option value="merge">מיזוג - הוספת נתונים חדשים בלבד (מומלץ להעברה בין מחשבים)</option>
        <option value="replace">החלפה מלאה - מוחק את כל הנתונים הקיימים ומחליף בגיבוי</option>
      </select>
    </div>
    <div class="hint" id="b_modeHint">מיזוג: כל פרויקט/קבלן/מיקום/יומן שלא קיים כאן עדיין - יתווסף. נתונים קיימים לא יימחקו ולא יידרסו. אם יומן מהקובץ מתנגש עם יומן קיים (אותו פרויקט ואותו תאריך, אך רשומות שונות) - הוא ידולג, ותקבל סיכום מפורט כדי לבדוק ידנית.</div>
    <div class="row-actions"><button class="btn secondary" id="b_import">טען מהקובץ שנבחר</button></div>
  `;
  main.appendChild(card);

  document.getElementById('b_export').onclick = ()=>{
    const payload = { exportedAt:new Date().toISOString(), projects, contractors, locations, subProjects, crews, workers, toolboxRecords, workCardEntries, company, logs };
    const blob = new Blob([JSON.stringify(payload)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `גיבוי-יומן-עבודה-${todayStr()}.json`;
    a.click();
    toast('קובץ הגיבוי הורד');
  };

  document.getElementById('b_mode').onchange = e=>{
    const hint = document.getElementById('b_modeHint');
    hint.textContent = e.target.value==='merge'
      ? 'מיזוג: כל פרויקט/קבלן/מיקום/יומן שלא קיים כאן עדיין - יתווסף. נתונים קיימים לא יימחקו ולא יידרסו. אם יומן מהקובץ מתנגש עם יומן קיים (אותו פרויקט ואותו תאריך, אך רשומות שונות) - הוא ידולג, ותקבל סיכום מפורט כדי לבדוק ידנית.'
      : 'החלפה מלאה: כל הנתונים שקיימים כרגע במחשב הזה יימחקו לצמיתות ויוחלפו בתוכן הקובץ. להשתמש רק אם אתה בטוח שאין כאן שום דבר ששווה לשמור.';
  };

  document.getElementById('b_import').onclick = ()=>{
    const fileInput = document.getElementById('b_file');
    const file = fileInput.files[0];
    if(!file){ toast('נא לבחור קובץ גיבוי'); return; }
    const mode = document.getElementById('b_mode').value;
    const warnText = mode==='replace'
      ? 'פעולה זו תמחק לצמיתות את כל הנתונים הקיימים במחשב הזה ותחליף אותם בתוכן הקובץ. להמשיך?'
      : 'פעולה זו תוסיף למחשב הזה כל פרויקט/קבלן/מיקום/יומן חדש שנמצא בקובץ. נתונים קיימים לא יימחקו. להמשיך?';
    if(!confirm(warnText)) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        if(!data.projects || !data.contractors || !data.logs) throw new Error('bad format');
        if(mode==='replace'){ restoreDataReplace(data); }
        else { restoreDataMerge(data); }
        draft = null;
        render();
      }catch(e){ toast('קובץ הגיבוי אינו תקין'); }
    };
    reader.readAsText(file);
  };
}

function restoreDataReplace(data){
  applyFullData(data);
  saveAll();
  toast('ההחלפה הושלמה בהצלחה - נשמר ב-Drive');
}

/* Adds anything from an imported backup that doesn't already exist locally,
   without touching or deleting anything already here. Logs are matched by id
   (same log, already synced before -> skipped) and additionally guarded by
   project+date (two DIFFERENT logs for the same project+date is a conflict -
   never silently merged, always reported for manual review). */
function restoreDataMerge(data){
  const incomingProjects = Array.isArray(data.projects) ? data.projects : [];
  const incomingContractors = Array.isArray(data.contractors) ? data.contractors : [];
  const incomingLocations = Array.isArray(data.locations) ? data.locations : [];
  const incomingSubProjects = Array.isArray(data.subProjects) ? data.subProjects : [];
  const incomingCrews = Array.isArray(data.crews) ? data.crews : [];
  const incomingWorkers = Array.isArray(data.workers) ? data.workers : [];
  const incomingToolboxRecords = Array.isArray(data.toolboxRecords) ? data.toolboxRecords : [];
  const incomingWorkCardEntries = Array.isArray(data.workCardEntries) ? data.workCardEntries : [];
  const incomingLogs = Array.isArray(data.logs) ? data.logs : [];

  let addedProjects = 0, addedContractors = 0, addedLocations = 0, addedSubProjects = 0, addedCrews = 0, addedWorkers = 0, addedToolboxRecords = 0, addedWorkCardEntries = 0, addedLogs = 0;
  let skippedConflicts = [], renumbered = [];

  incomingProjects.forEach(p=>{
    if(!projects.some(x=>x.id===p.id)){
      if(!Array.isArray(p.managerHistory)){
        p.managerHistory = p.manager ? [{manager:p.manager, from:'0001-01-01'}] : [];
      }
      if(typeof p.nextSerial !== 'number') p.nextSerial = 1;
      projects.push(p);
      addedProjects++;
    }
  });
  incomingContractors.forEach(c=>{
    if(!contractors.some(x=>x.id===c.id)){ contractors.push(c); addedContractors++; }
  });
  incomingLocations.forEach(l=>{
    if(!locations.some(x=>x.id===l.id)){ locations.push(l); addedLocations++; }
  });
  incomingSubProjects.forEach(sp=>{
    if(!subProjects.some(x=>x.id===sp.id)){ subProjects.push(sp); addedSubProjects++; }
  });
  incomingCrews.forEach(cr=>{
    if(!crews.some(x=>x.id===cr.id)){ crews.push(cr); addedCrews++; }
  });
  incomingWorkers.forEach(w=>{
    if(!workers.some(x=>x.id===w.id)){
      if(!Array.isArray(w.crewHistory)){
        w.crewHistory = w.crewId ? [{crewId:w.crewId, from:'0001-01-01'}] : [];
      }
      workers.push(w); addedWorkers++;
    }
  });
  incomingToolboxRecords.forEach(t=>{
    if(!toolboxRecords.some(x=>x.id===t.id)){ toolboxRecords.push(t); addedToolboxRecords++; }
  });
  incomingWorkCardEntries.forEach(e=>{
    if(!workCardEntries.some(x=>x.id===e.id)){ workCardEntries.push(e); addedWorkCardEntries++; }
  });
  incomingLogs.forEach(l=>{
    if(logs.some(x=>x.id===l.id)) return; // already have this exact log - skip silently, nothing lost
    const dateConflict = logs.find(x=> x.projectId===l.projectId && (x.subProjectId||'')===(l.subProjectId||'') && x.date===l.date);
    if(dateConflict){
      const proj = projects.find(p=>p.id===l.projectId);
      skippedConflicts.push(`${fmtDate(l.date)} (${proj?proj.name:'פרויקט לא ידוע'})`);
      return;
    }
    // Two machines working offline can independently hand out the same serial
    // number to different logs for the same project. Detect that and hand the
    // incoming log a fresh number instead of silently keeping a duplicate.
    const proj = projects.find(p=>p.id===l.projectId);
    if(proj && l.serialNumber){
      const collision = logs.some(x=>x.projectId===l.projectId && x.serialNumber===l.serialNumber);
      if(typeof proj.nextSerial !== 'number') proj.nextSerial = 1;
      if(collision){
        const oldSerial = l.serialNumber;
        l.serialNumber = proj.nextSerial;
        proj.nextSerial += 1;
        renumbered.push(`${fmtDate(l.date)}: מס' ${formatSerial(oldSerial)} → מס' ${formatSerial(l.serialNumber)}`);
      } else if(l.serialNumber >= proj.nextSerial){
        proj.nextSerial = l.serialNumber + 1;
      }
    }
    logs.push(l);
    addedLogs++;
  });

  saveAll();

  let summary = `המיזוג הושלם: נוספו ${addedLogs} יומנים חדשים`;
  if(addedProjects||addedContractors||addedLocations||addedSubProjects||addedCrews||addedWorkers||addedToolboxRecords||addedWorkCardEntries){
    summary += ` (וגם ${addedProjects} פרויקטים, ${addedContractors} קבלנים, ${addedLocations} מיקומים, ${addedSubProjects} תת-פרויקטים, ${addedCrews} קבוצות, ${addedWorkers} פועלים, ${addedToolboxRecords} רישומי טולבוקס, ${addedWorkCardEntries} רישומי כרטיס עבודה)`;
  }
  if(skippedConflicts.length){
    summary += `. ${skippedConflicts.length} יומנים דולגו עקב התנגשות תאריך: ${skippedConflicts.join(', ')} - יש לבדוק ידנית דרך "איתור יומנים".`;
  }
  if(renumbered.length){
    summary += `. שים לב: ${renumbered.length} יומנים קיבלו מספר סידורי חדש עקב התנגשות מספור בין המחשבים: ${renumbered.join(', ')}.`;
  }
  toast(summary);
}

/* ===================== Google Sign-In + Drive bootstrap ===================== */
const DRIVE_CLIENT_ID = '313815811753-t2apguvh41f919idhsittrbb96896aov.apps.googleusercontent.com';
const DRIVE_SCOPES = 'https://www.googleapis.com/auth/drive.file email profile';
const DRIVE_FILE_NAME = 'יומן-עבודה-נתונים.json';
let accessToken = null;
let tokenClient = null;
let driveFileId = null;
let driveFileModifiedTime = null;

function gateStatus(text){
  const el = document.getElementById('gateStatus');
  if(el) el.textContent = text;
}

window.addEventListener('load', ()=>{
  if(typeof google === 'undefined' || !google.accounts){
    gateStatus('שגיאה: ספריית ההתחברות של Google לא נטענה. בדוק חיבור לאינטרנט ורענן את הדף.');
    return;
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPES,
    callback: onDriveSignIn
  });
  document.getElementById('gateSignInBtn').onclick = ()=>{
    gateStatus('פותח חלון התחברות של Google...');
    // prompt:'' (instead of 'consent') asks Google to skip the account-chooser/consent/
    // "app not verified" screens when they're not actually needed - i.e. every time after
    // the first, since the approval from the first sign-in is already on file. The first-ever
    // sign-in for a given Google account still shows the full screens regardless (Google
    // requires that), this only stops it from re-showing them on every later page load.
    tokenClient.requestAccessToken({prompt:''});
  };
});

async function onDriveSignIn(resp){
  if(resp.error){
    gateStatus('שגיאה בהתחברות: ' + resp.error + (resp.error_description ? (' - ' + resp.error_description) : ''));
    return;
  }
  accessToken = resp.access_token;
  gateStatus('טוען נתונים מ-Drive...');
  try{
    await loadOrCreateDriveFile();
    document.getElementById('signInGate').style.display = 'none';
    document.querySelector('header').style.visibility = 'visible';
    renderNav();
    render();
  }catch(e){
    gateStatus('שגיאה בטעינת הנתונים מ-Drive: ' + e.message);
  }
}

/* Finds the single shared data file this app created earlier (drive.file scope only ever sees
   files this app itself created/opened, so a plain name search is safe and can't collide with
   an unrelated file of the same name elsewhere in the user's Drive). First-ever sign-in for a
   brand-new Drive (nothing created yet) seeds an empty one instead of failing. */
async function loadOrCreateDriveFile(){
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const listRes = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,modifiedTime)`, {
    headers:{ Authorization:'Bearer '+accessToken }
  });
  const listJson = await listRes.json();
  if(!listRes.ok) throw new Error(listJson.error ? listJson.error.message : 'שגיאה בחיפוש הקובץ ב-Drive');

  if(listJson.files && listJson.files.length>0){
    driveFileId = listJson.files[0].id;
    driveFileModifiedTime = listJson.files[0].modifiedTime;
    const contentRes = await fetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`, {
      headers:{ Authorization:'Bearer '+accessToken }
    });
    if(!contentRes.ok) throw new Error('שגיאה בקריאת תוכן הקובץ מ-Drive');
    const data = await contentRes.json();
    applyFullData(data);
  } else {
    applyFullData({});
    const metadata = { name: DRIVE_FILE_NAME, mimeType:'application/json' };
    const boundary = 'yoman_avoda_boundary_' + Date.now();
    const body =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(buildFullPayload())}\r\n` +
      `--${boundary}--`;
    const createRes = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime', {
      method:'POST',
      headers:{ Authorization:'Bearer '+accessToken, 'Content-Type':'multipart/related; boundary='+boundary },
      body
    });
    const createJson = await createRes.json();
    if(!createRes.ok) throw new Error(createJson.error ? createJson.error.message : 'שגיאה ביצירת הקובץ ב-Drive');
    driveFileId = createJson.id;
    driveFileModifiedTime = createJson.modifiedTime;
  }
}
</script>
