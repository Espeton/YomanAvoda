<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מעקב ביצוע - אתר בנייה</title>
<style>
  :root{
    --navy:#2C5282; --navy-dark:#1A365D; --ink:#B33A3A;
    --bg:#F5F6F8; --card:#FFFFFF; --text:#1F2937; --muted:#6B7280; --border:#E2E8F0;
    --ok:#2F855A; --warn:#B7791F; --bad:#C53030;
    --c0:#EDF2F7; --c1:#E3EEFB; --c2:#C3DAF7; --c3:#8FB8EC; --c5:#68C08F;
    --topbar-h:0px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:Arial,"Segoe UI",Tahoma,sans-serif; background:var(--bg); color:var(--text); direction:rtl; min-height:100vh; font-size:14px;}
  #topbar{position:sticky; top:0; z-index:40;}
  header{background:linear-gradient(135deg,var(--navy-dark),var(--navy)); color:#fff; padding:10px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;}
  header h1{margin:0; font-size:19px; letter-spacing:.3px;}
  header .sub{font-size:12px; color:#CBD8EA; margin-top:2px;}
  header .hbtns{display:flex; gap:8px; align-items:center;}
  nav{display:flex; gap:4px; background:var(--navy-dark); padding:0 16px; overflow-x:auto;}
  nav button{background:transparent; border:none; color:#CBD8EA; padding:12px 16px; font-size:13.5px; cursor:pointer; border-bottom:3px solid transparent; white-space:nowrap; font-family:inherit;}
  nav button.active{color:#fff; border-bottom:3px solid var(--ink); font-weight:bold;}
  .badge{display:inline-block; min-width:18px; padding:1px 6px; border-radius:9px; background:var(--ink); color:#fff; font-size:11px; margin-inline-start:4px;}
  main{max-width:1320px; margin:20px auto; padding:0 16px 60px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px; margin-bottom:16px; box-shadow:0 1px 2px rgba(0,0,0,.04);}
  .card h2{margin-top:0; font-size:16px; color:var(--navy-dark); border-bottom:1px solid var(--border); padding-bottom:10px;}
  h3{font-size:14px; color:var(--navy); margin:14px 0 8px;}
  label{display:block; font-size:12.5px; color:var(--muted); margin-bottom:4px; font-weight:bold;}
  input,select,textarea{padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:13.5px; background:#fff; color:var(--text); max-width:100%;}
  textarea{width:100%; min-height:110px;}
  button.btn{background:var(--navy); color:#fff; border:none; padding:9px 16px; border-radius:6px; cursor:pointer; font-size:13px; font-family:inherit;}
  button.btn:hover{background:var(--navy-dark);}
  button.btn:disabled{opacity:.45; cursor:not-allowed;}
  button.btn.secondary{background:#fff; color:var(--navy); border:1px solid var(--navy);}
  button.btn.secondary.on{background:var(--navy); color:#fff;}
  button.btn.danger{background:#fff; color:var(--bad); border:1px solid var(--bad);}
  button.btn.small{padding:5px 10px; font-size:12px;}
  header button.btn.secondary{background:transparent; color:#fff; border-color:#CBD8EA;}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; align-items:center;}
  .chips .lbl{font-size:12.5px; color:var(--muted); font-weight:bold; margin-inline-end:4px;}
  .chip{border:1px solid var(--border); background:#fff; color:var(--navy-dark); border-radius:16px; padding:6px 16px; cursor:pointer; font-size:13px; font-family:inherit;}
  .chip.on{background:var(--navy); border-color:var(--navy); color:#fff;}
  .chip small{opacity:.75; margin-inline-start:4px;}
  .bar{display:flex; gap:14px; align-items:flex-end; flex-wrap:wrap; margin-bottom:12px; font-size:13px;}
  .bar label.inl{display:flex; gap:6px; align-items:center; margin:0; font-weight:normal; color:var(--text);}
  .note{background:#EFF6FF; border:1px solid #BFDBFE; color:#1E40AF; padding:10px 14px; border-radius:8px; font-size:12.5px; margin:12px 0 0;}
  .warnbox{background:#FFFBEB; border:1px solid #F5D98B; color:#7A5A0A; padding:12px 16px; border-radius:8px; margin-bottom:14px;}
  .empty{color:var(--muted); font-size:13px; padding:14px; text-align:center;}
  table{width:100%; border-collapse:collapse; font-size:13px; border:1px solid var(--border);}
  th,td{padding:6px 7px; border:1px solid var(--border); text-align:center;}
  th{background:#F0F4F8; color:var(--navy-dark); font-size:12px;}
  td.l{text-align:right;}
  td.lvl{font-weight:bold; text-align:right; white-space:nowrap; background:#fff;}
  td.lvlpct{font-weight:bold; background:#F0F4F8; color:var(--navy-dark); white-space:nowrap;}
  td.na{color:#A0AEC0; background:var(--c0); opacity:.7;}
  tfoot td{font-weight:bold; background:#F0F4F8; color:var(--navy-dark);}
  .scroll{overflow-x:auto;}
  .board-head{display:flex; justify-content:space-between; align-items:flex-end; gap:8px; margin-bottom:8px; flex-wrap:wrap;}
  .board-head .name{font-size:15px; font-weight:bold; background:var(--navy); color:#fff; padding:3px 16px; border-radius:6px;}
  .board-head .total{font-size:24px; font-weight:bold; color:var(--navy-dark);}
  .cell{display:block; width:100%; border:none; cursor:pointer; padding:6px 2px; border-radius:4px; font-size:13px; font-family:inherit; color:var(--navy-dark); position:relative; min-width:46px;}
  .cell:hover{outline:2px solid var(--navy);}
  .cell .bell{position:absolute; top:-3px; inset-inline-start:-1px; font-size:10px;}
  .p0{background:var(--c0); color:var(--muted);} .p1{background:var(--c1);} .p2{background:var(--c2);} .p3{background:var(--c3);} .p5{background:var(--c5); color:#14432A; font-weight:bold;}
  .legend{display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--muted); margin-top:6px;}
  .legend i{display:inline-block; width:14px; height:14px; border-radius:3px; vertical-align:middle; margin-inline-end:4px; border:1px solid var(--border);}
  .sum{font-size:12px; color:var(--muted);}
  .curcon{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; background:#F0F4F8; border:1px solid var(--border); border-radius:8px; padding:9px 14px; margin-bottom:12px;}
  .curcon b{color:var(--navy-dark);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media (max-width:860px){ .grid2{grid-template-columns:1fr;} header{padding:10px 14px;} }
  .wrow{display:flex; align-items:center; gap:8px; padding:4px 0; border-bottom:1px dashed var(--border);}
  .wrow .nm{flex:1;}
  .wrow input[type=number]{width:70px; text-align:center;}
  .wrow input[type=text]{flex:1;}
  .facade{display:flex; flex-direction:column; gap:8px;}
  .frow{display:flex; gap:10px; align-items:stretch; border:1px solid var(--border); border-radius:8px; padding:8px; background:#fff;}
  .frow .fl{flex:0 0 96px; display:flex; flex-direction:column; justify-content:center; gap:2px; font-weight:bold; color:var(--navy-dark);}
  .frow .fl .pc{font-size:12px; color:var(--muted); font-weight:normal;}
  .frow.selectable .fl{cursor:pointer; text-decoration:underline dotted;}
  .tiles{display:flex; gap:8px; flex-wrap:wrap; flex:1;}
  .tile{border:2px solid transparent; border-radius:8px; padding:7px 10px; min-width:92px; cursor:pointer; font-family:inherit; text-align:center; font-size:13px; color:var(--navy-dark);}
  .tile .tn{font-weight:bold; font-size:12.5px;}
  .tile .tp{font-size:17px; font-weight:bold;}
  .tile .tt{font-size:10.5px; opacity:.8;}
  .tile.lobby{min-width:120px; border-style:dashed; border-color:var(--navy);}
  .tile.picked{outline:3px solid var(--ink); outline-offset:1px;}
  .tile:hover{filter:brightness(.96);}
  .tile.na{background:var(--c0); color:var(--muted); cursor:default;}
  .typebadge{display:inline-block; font-size:10px; padding:0 6px; border-radius:8px; background:var(--navy); color:#fff; margin-top:2px;}
  .typebadge.t2{background:var(--warn);} .typebadge.t3{background:var(--ink);}
  .ov{position:fixed; inset:0; background:rgba(26,54,93,.55); z-index:60; display:none; align-items:center; justify-content:center; padding:12px;}
  .ov.on{display:flex;}
  .modal{background:#fff; border-radius:12px; width:100%; max-width:560px; max-height:92vh; overflow:auto; padding:18px 20px; box-shadow:0 12px 40px rgba(0,0,0,.4);}
  .modal h2{margin:0 0 2px; font-size:17px; color:var(--navy-dark); border:none; padding:0;}
  .modal .sub{color:var(--muted); font-size:13px; margin-bottom:12px;}
  .f{margin-bottom:10px;} .f input[type=text],.f select,.f input[type=date],.f input[type=number]{width:100%;}
  .row2{display:flex; gap:10px;} .row2 > div{flex:1;}
  .itemrow{display:grid; grid-template-columns:1fr 110px 60px; gap:8px; align-items:center; padding:5px 0; border-bottom:1px dashed var(--border);}
  .itemrow .nm small{display:block; color:var(--warn); font-size:11px;}
  .itemrow input[type=number]{width:60px; text-align:center;}
  .hist{font-size:12.5px; border:1px solid var(--border); border-radius:8px; max-height:130px; overflow:auto;}
  .hist div{padding:5px 9px; border-bottom:1px solid var(--border);} .hist div:last-child{border:none;}
  .rem-box{border:1px solid #BFDBFE; border-radius:8px; padding:9px 12px; background:#EFF6FF;}
  .rem-box label.inl{display:flex; gap:6px; align-items:center; margin:0; color:#1E40AF;}
  .pill{display:inline-block; padding:1px 9px; border-radius:10px; font-size:12px; color:#fff;}
  .pill.today{background:var(--warn);} .pill.over{background:var(--bad);} .pill.soon{background:var(--muted);} .pill.done{background:var(--ok);}
  #popup .modal{border-top:6px solid var(--warn);}
  .remitem{border:1px solid var(--border); border-radius:8px; padding:9px 12px; margin-bottom:8px; background:#fff;}
  .remitem .t{font-weight:bold; color:var(--navy-dark);} .remitem .d{font-size:12.5px; color:var(--muted); margin:3px 0 7px;}
  .right{display:flex; gap:8px; flex-wrap:wrap;}
  .varbox{border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-top:8px; background:#FAFBFC;}
  /* sign-in gate */
  #signInGate{position:fixed; inset:0; background:var(--bg); z-index:1000; display:flex; align-items:center; justify-content:center;}
  #signInGate .card{max-width:420px; width:90%;}
  #signInGate .hint{margin-top:10px; min-height:16px; font-size:12px; color:var(--muted);}
  /* drive problem dialog */
  #driveProblemBar{display:none; position:fixed; inset:0; z-index:3000; background:rgba(15,23,42,.72); align-items:center; justify-content:center; padding:16px;}
  #driveProblemBar .dp-box{background:#fff; border-top:6px solid #B91C1C; border-radius:12px; max-width:480px; width:100%; padding:22px 24px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.4);}
  #driveProblemBar .dp-icon{font-size:42px; line-height:1; color:#B91C1C;}
  #driveProblemBar h2{margin:6px 0 8px; font-size:20px; color:#991B1B; border:none; padding:0;}
  #driveProblemBar p{margin:6px 0; font-size:14.5px;}
  #driveProblemBar .dp-warn{background:#FEF2F2; border:1px solid #FCA5A5; border-radius:8px; padding:8px 10px; color:#991B1B;}
  #driveProblemBar .dp-actions{display:flex; flex-direction:column; gap:8px; margin-top:14px;}
  #driveProblemBar .dp-actions .btn{width:100%; font-size:15px;}
  #driveProblemBar #dpFix{background:#B91C1C;}
  .toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#1F2937; color:#fff; padding:10px 18px; border-radius:8px; font-size:13.5px; z-index:2500; display:none; max-width:90%;}
  @media print{ #topbar,.bar,.no-print,.chips,button,.toast{display:none !important;} body{background:#fff;} main{margin:0;} .card{box-shadow:none;} }
</style>
</head>
<body>

<div id="signInGate">
  <div class="card">
    <h2>מעקב ביצוע — אתר בנייה</h2>
    <div class="note">האפליקציה שומרת את כל הנתונים בקובץ אחד ב-Google Drive, כדי שכמה אנשים יוכלו לראות ולעדכן את אותם נתונים. יש להתחבר עם חשבון Google שהוגדר כמשתמש מורשה ולאשר גישה ל-Drive.</div>
    <div style="margin-top:12px;"><button id="gateSignInBtn" class="btn">התחבר עם Google</button></div>
    <div class="hint" id="gateStatus"></div>
  </div>
</div>

<div id="topbar" style="visibility:hidden;">
  <header>
    <div>
      <h1>מעקב ביצוע — אתר בנייה</h1>
      <div class="sub">תחום · שלב · מפלס · דירות ולובי <span id="driveSaveStatus"></span></div>
    </div>
    <div class="hbtns no-print"><button class="btn secondary small" id="saveBtn" title="שומר מיד ומאשר שהכול הגיע ל-Drive">💾 שמור</button></div>
  </header>
  <nav id="tabs"></nav>
</div>
<main><div id="view"></div></main>

<div class="ov" id="editor"><div class="modal" id="editorBox"></div></div>
<div class="ov" id="popup"><div class="modal" id="popupBox"></div></div>
<div class="toast" id="toast"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
/* ============================================================== helpers */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const pad = n => String(n).padStart(2,'0');
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayStr = () => isoOf(new Date());
const addDays = (iso, n) => { const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoOf(d); };
const fmt = iso => { if(!iso || iso<'0001-02-01') return ''; const [y,m,d] = iso.split('-'); return `${+d}/${+m}/${y.slice(2)}`; };
const round1 = n => Math.round(n*10)/10;
const uid = p => (p||'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const cleanName = s => String(s||'').replace(/\|/g,'/').trim();
const bandOf = p => p==null ? 'p0' : p<=0 ? 'p0' : p<25 ? 'p1' : p<50 ? 'p2' : p<100 ? 'p3' : 'p5';
const pctTxt = p => p==null ? '—' : (p>0 ? Math.round(p)+'%' : '·');
const fp = p => p==null ? '—' : Math.round(p)+'%';
let toastTimer = null;
function toast(msg){ const el = document.getElementById('toast'); el.textContent = msg; el.style.display = 'block'; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.style.display='none'; }, 4200); }

/* ============================================================== data model */
/* Everything lives in ONE JSON file on Google Drive ("מעקב-ביצוע-נתונים.json"), shared by all users:
   contractors[]    {id, name, active}
   assignments[]    {id, siteId, tradeId, contractorId, from, to, reason, note} - the performing contractor per trade+site
   sites[]          buildings and basement parts: {id, kind:'building'|'basement', name, under, levels:[{id, name, comps:[{id, kind:'apartment'|'lobby', name, type, lay, rooms, area}]}]}
   trades[]         templates: {id, name, phases:[{id, name, weight, mode:'level'|'component', levelItems | compItems + variants + lobbyWeight}]}
   entries[]        append-only progress log {id, key, date, pct, note, contractorId, by, at}  (key = site|trade.phase|unit|item)
   reminders[]      {id, key, title, baseDate, due, status:'open'|'done', snoozedTo, doneBy, doneOn}
   settings         {aptTypes:[...]}
   Progress is never overwritten: every update is a new entry; the cell shows the latest one. */
let contractors = [], crews = [], assignments = [], sites = [], trades = [], entries = [], reminders = [], settings = {aptTypes:['שוק חופשי','מחיר למשתכן','פנטהאוז']};
const it = (n,w)=>({n, w: w||1});
/* Starter templates (examples - edit them in the "תבניות" tab) */
function defaultTrades(){
  const mk = (id,name,phases)=>({id,name,phases});
  return [
    mk('concrete','בטון ובלוקים',[{id:'frame', name:'שלד', weight:100, mode:'level', levelItems:[{...it('רצפה',20), scope:'ground'},it('קירות',25),it('תקרה',50),it('בלוקים',5)]}]),
    mk('plumb','אינסטלציה',[
      {id:'black', name:'שלב שחור', weight:60, mode:'level', levelItems:[it('צנרת ורטיקלית - קירות'),it('צנרת ורטיקלית - תקרה'),it('צנרת הוריזונטלית - קירות'),it('צנרת הוריזונטלית - תקרה')]},
      {id:'white', name:'שלב לבן (אביזרים)', weight:40, mode:'component', lobbyWeight:0.5, compItems:{apartment:[it('אסלה'),it('כיור'),it('ארון אמבט'),it('ברזים')], lobby:[it('ברז שירות'),it('נקודת ניקוז')]}, variants:{}}]),
    mk('elec','חשמל',[
      {id:'black', name:'שלב שחור (שרוולים)', weight:40, mode:'level', levelItems:[it('שרוולים - קירות'),it('שרוולים - תקרה'),it('קופסאות')]},
      {id:'wires', name:'משיכת חוטים', weight:25, mode:'level', levelItems:[it('חוטים - קירות'),it('חוטים - תקרה')]},
      {id:'white', name:'שלב לבן (אביזרים)', weight:35, mode:'component', lobbyWeight:0.6, compItems:{apartment:[it('שקעים ומפסקים'),it('גופי תאורה'),it('לוח דירתי')], lobby:[it('גופי תאורה'),it('לוח קומתי')]}, variants:{}}]),
    mk('steel','מסגרות',[{id:'all', name:'התקנה', weight:100, mode:'component', lobbyWeight:1, compItems:{apartment:[it('דלת כניסה'),it('מעקה מרפסת')], lobby:[it('דלת לובי'),it('מעקה מדרגות')]}, variants:{}}]),
    mk('kitchen','מטבחים',[{id:'all', name:'התקנה', weight:100, mode:'component', lobbyWeight:0, compItems:{apartment:[it('ארונות'),it('שיש'),it('חיבורים')], lobby:[]}, variants:{}}]),
    mk('alum','אלומיניום',[
      {id:'frames', name:'משקופים', weight:30, mode:'level', levelItems:[it('משקופי חלונות'),it('משקופי דלתות')]},
      {id:'install', name:'התקנת חלונות', weight:70, mode:'component', lobbyWeight:0.5, compItems:{apartment:[it('חלונות'),it('תריסים')], lobby:[it('חלון לובי')]}, variants:{}}]),
    mk('doors','דלתות פנים',[{id:'all', name:'התקנה', weight:100, mode:'component', lobbyWeight:0, compItems:{apartment:[it('משקופים'),it('כנפי דלתות'),it('פרזול')], lobby:[]}, variants:{}}])
  ];
}
const SWAP_REASONS = ['לא עמד בהתחייבות','סיים את ההתקשרות','סולק מהאתר','אחר'];
const BEGIN = '0001-01-01';

function buildPayload(){ return {version:1, exportedAt:new Date().toISOString(), contractors, crews, assignments, sites, trades, entries, reminders, settings}; }
function applyData(d){
  d = d || {};
  contractors = Array.isArray(d.contractors) ? d.contractors : [];
  crews = Array.isArray(d.crews) ? d.crews : [];
  assignments = Array.isArray(d.assignments) ? d.assignments : [];
  sites = Array.isArray(d.sites) ? d.sites : [];
  trades = Array.isArray(d.trades) ? d.trades : (d.trades===undefined ? defaultTrades() : []);
  entries = Array.isArray(d.entries) ? d.entries : [];
  reminders = Array.isArray(d.reminders) ? d.reminders : [];
  settings = (d.settings && typeof d.settings==='object') ? d.settings : {aptTypes:['שוק חופשי','מחיר למשתכן','פנטהאוז']};
  if(!Array.isArray(settings.aptTypes) || !settings.aptTypes.length) settings.aptTypes = ['שוק חופשי','מחיר למשתכן','פנטהאוז'];
  invalidateIndex();
}

/* ---- progress index (key -> entries sorted by date) */
let entryIndex = null;
function invalidateIndex(){ entryIndex = null; }
function index(){
  if(entryIndex) return entryIndex;
  const m = new Map();
  entries.forEach(e=>{ let a = m.get(e.key); if(!a){ a = []; m.set(e.key,a); } a.push(e); });
  m.forEach(a=> a.sort((x,y)=> x.date.localeCompare(y.date) || (x.at||'').localeCompare(y.at||'')));
  return entryIndex = m;
}
const curGet = k => { const a = index().get(k); return a ? a[a.length-1].pct : 0; };
const getAt = d => k => { const a = index().get(k); let p = 0; if(a) for(const e of a){ if(e.date<=d) p = e.pct; else break; } return p; };
const entriesOf = k => index().get(k) || [];

/* ---- structure helpers */
const siteById = id => sites.find(s=>s.id===id);
const tradeById = id => trades.find(t=>t.id===id);
const phaseOf = (t,pid) => t.phases.find(p=>p.id===pid) || t.phases[0];
const contractorName = id => { const c = contractors.find(x=>x.id===id); return c ? c.name : (id ? '(קבלן נמחק)' : 'לא הוקצה קבלן'); };
const phaseKey = (t,ph) => t.id+'.'+ph.id;
const keyOf = (sid,pk,unit,item) => [sid,pk,unit,item].join('|');
const levelsTopDown = s => [...s.levels].reverse();
const typeCls = ty => ['','t2','t3'][settings.aptTypes.indexOf(ty)] || '';
function unitItems(phase, comp){
  const core = (phase.compItems && phase.compItems[comp.kind]) || [];
  if(comp.kind!=='apartment') return core;
  const v = phase.variants && phase.variants[comp.type];
  return v ? core.filter(i=>!(v.remove||[]).includes(i.n)).concat(v.add||[]) : core;
}
/* ---- performing contractor per trade + site */
function assignRows(sid,tid){ return assignments.filter(a=>a.siteId===sid && a.tradeId===tid).sort((a,b)=>a.from.localeCompare(b.from)); }
function contractorAt(sid,tid,date){ let c = ''; assignRows(sid,tid).forEach(a=>{ if(date>=a.from) c = a.contractorId; }); return c; }
function currentAssign(sid,tid){ const r = assignRows(sid,tid); return r.length ? r[r.length-1] : null; }

/* Level-mode items can be limited to some levels: scope '' = every level, 'ground' = only the ground floor (קרקע),
   'upper' = every level except the ground floor (e.g. a floor slab "רצפה" only exists on the ground floor). */
function levelItemsFor(ph, lv){ return (ph.levelItems||[]).filter(i=> !i.scope || (i.scope==='ground' ? lv.id==='קרקע' : lv.id!=='קרקע')); }
/* ============================================================== roll-ups (getter = current or "as of date") */
function unitPct(sid,pk,unit,items,get){ let s = 0, w = 0; items.forEach(i=>{ s += i.w*get(keyOf(sid,pk,unit,i.n)); w += i.w; }); return w ? s/w : null; }
function levelPct(s,t,ph,lv,get){
  const pk = phaseKey(t,ph);
  if(ph.mode==='level') return unitPct(s.id,pk,'L:'+lv.id,levelItemsFor(ph,lv),get);
  let sum = 0, w = 0;
  lv.comps.forEach(c=>{ const items = unitItems(ph,c); if(!items.length) return; const cw = c.kind==='lobby' ? (ph.lobbyWeight==null?1:ph.lobbyWeight) : 1; if(cw<=0) return; sum += cw*unitPct(s.id,pk,c.id,items,get); w += cw; });
  return w ? sum/w : null;
}
function phasePct(s,t,ph,get){ let sum = 0, n = 0; s.levels.forEach(l=>{ const p = levelPct(s,t,ph,l,get); if(p!=null){ sum += p; n++; } }); return n ? sum/n : null; }
function tradePct(s,t,get){ let sum = 0, w = 0; t.phases.forEach(ph=>{ const p = phasePct(s,t,ph,get); if(p==null) return; sum += ph.weight*p; w += ph.weight; }); return w ? sum/w : null; }
function addEntry(sid,tid,pk,unit,item,pct,date,note){
  entries.push({id:uid('en'), key:keyOf(sid,pk,unit,item), date, pct, note:note||'', contractorId:contractorAt(sid,tid,date), by:(me&&me.name)||'', at:new Date().toISOString()});
  invalidateIndex();
}

/* ============================================================== UI state */
let tab = 'overview', me = null;
let curS = '', curT = '', curP = '', ovS = '';
let selectMode = false; const picked = new Set();
let setupT = '', rMonth = todayStr().slice(0,7), rTrade = 'all', rS = 'all', rCon = 'all';
function ensureSelection(){
  if(!siteById(curS)) curS = (sites[0]||{}).id || '';
  if(!siteById(ovS)) ovS = (sites[0]||{}).id || '';
  if(!tradeById(curT)) curT = (trades[0]||{}).id || '';
  const t = tradeById(curT); if(t && !t.phases.some(p=>p.id===curP)) curP = t.phases[0] ? t.phases[0].id : '';
  if(!tradeById(setupT)) setupT = (trades[0]||{}).id || '';
}
const siteOptions = (sel, allLabel)=> `${allLabel?`<option value="all">${allLabel}</option>`:''}<optgroup label="בניינים">${sites.filter(s=>s.kind==='building').map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup><optgroup label="מרתף (נפרד מהבניינים)">${sites.filter(s=>s.kind==='basement').map(x=>`<option value="${x.id}" ${x.id===sel?'selected':''}>${esc(x.name)}</option>`).join('')}</optgroup>`;
const contractorOptions = (sel, ph)=> `<option value="">${ph||'בחר קבלן...'}</option>` + [...contractors].filter(c=>c.active!==false||c.id===sel).sort((a,b)=>a.name.localeCompare(b.name,'he')).map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${esc(c.name)}</option>`).join('');

/* ---- reminders */
const remVis = r => r.snoozedTo || r.due;
const dueOpen = ()=> reminders.filter(r=>r.status==='open' && remVis(r)<=todayStr()).sort((a,b)=>remVis(a).localeCompare(remVis(b)));
function describeKey(k){
  const [sid,pk,unit,item] = k.split('|'), [tid,pid] = pk.split('.'), s = siteById(sid), t = tradeById(tid);
  if(!s || !t) return k;
  const ph = phaseOf(t,pid);
  let where = unit.startsWith('L:') ? unit.slice(2) : (()=>{ for(const l of s.levels){ const c = l.comps.find(x=>x.id===unit); if(c) return l.name+' · '+c.name; } return unit; })();
  return `${s.name} · ${t.name} (${ph.name}) · ${where} · ${item}`;
}

/* ============================================================== rendering */
function renderTabs(){
  const n = dueOpen().length;
  const items = [['overview','סקירה'],['track','מעקב מפורט'],['templates','תבניות'],['settings','הגדרות'],['report','דוח חודשי'],['rem','תזכורות']];
  document.getElementById('tabs').innerHTML = items.map(([id,l])=>`<button class="${tab===id?'active':''}" data-tab="${id}">${l}${id==='rem'&&n?`<span class="badge">${n}</span>`:''}</button>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=> b.onclick = ()=>{ tab = b.dataset.tab; render(); });
}
function render(){
  ensureSelection(); renderTabs();
  const v = document.getElementById('view');
  v.innerHTML = tab==='overview' ? overviewView() : tab==='track' ? trackView() : tab==='templates' ? templatesView() : tab==='settings' ? settingsView() : tab==='report' ? reportView() : remView();
  wire();
  const tb = document.getElementById('topbar'); if(tb) document.documentElement.style.setProperty('--topbar-h', tb.offsetHeight+'px');
}
function onboardingCard(){
  return `<div class="warnbox"><b>להתחלה:</b> עדיין לא הוגדר מבנה. עבור ל<a href="#" data-gosettings="1">הגדרות</a>, הדבק את רשימת הדירות מ-Excel (בניין, קומה, מספר דירה, טיפוס, חדרים, שטח, מחיר מטרה), הוסף את חלקי המרתף והקבלנים, ואז הקצה קבלן לכל תחום.</div>`;
}

/* ---------- overview */
function overviewView(){
  if(!sites.length) return onboardingCard();
  if(!trades.length) return '<div class="warnbox">לא הוגדרו תחומים. עבור ללשונית "תבניות".</div>';

  const row = s=> trades.map(t=>t.phases.map(ph=>{ const p = phasePct(s,t,ph,curGet); return `<td><button class="cell ${bandOf(p)}" data-go="${s.id}|${t.id}|${ph.id}">${pctTxt(p)}</button></td>`; }).join('')).join('');

    <tbody>${blds.map(s=>`<tr><td class="lvl"><a href="#" data-ovsel="${s.id}" style="color:inherit;">${esc(s.name)}</a></td><td>${s.levels.length}</td><td>${aptCount(s)}</td>${row(s)}</tr>`).join('')}</tbody></table></div></div>` : '';
  const zTable = zones.length ? `<div class="card"><h2>מרתף - מרחב נפרד מהבניינים</h2><div class="scroll"><table><thead><tr><th rowspan="2">חלק</th><th rowspan="2">מפלסים</th>${head1}</tr><tr>${head2}</tr></thead>
    <tbody>${zones.map(s=>`<tr><td class="lvl"><a href="#" data-ovsel="${s.id}" style="color:inherit;">${esc(s.name)}</a>${s.under?`<div class="sum">מתחת ל${esc(s.under)}</div>`:''}</td><td>${s.levels.length}</td>${row(s)}</tr>`).join('')}</tbody></table></div>
    <div class="sum" style="margin-top:6px;">המרתף אינו חלק מאף בניין: ההתקדמות בו לא נכנסת לאחוזי הבניינים, ולהפך. שלב שמתנהל לפי דירות ולובי אינו חל על מרתף ומסומן "—".</div></div>` : '';
  const s = siteById(ovS);
  const lvRows = levelsTopDown(s).map(lv=>`<tr><td class="lvl">${esc(lv.name)}</td>${trades.map(t=>t.phases.map(ph=>{ const p = levelPct(s,t,ph,lv,curGet); return `<td><button class="cell ${bandOf(p)}" data-go="${s.id}|${t.id}|${ph.id}">${pctTxt(p)}</button></td>`; }).join('')).join('')}</tr>`).join('');
  const foot = trades.map(t=>t.phases.map(ph=>`<td>${fp(phasePct(s,t,ph,curGet))}</td>`).join('')).join('');
  const tfoot = trades.map(t=>`<td colspan="${t.phases.length||1}">${fp(tradePct(s,t,curGet))}</td>`).join('');
  const detail = `<div class="bar"><div><label>פירוט מפלסים</label><select id="ovS">${siteOptions(ovS)}</select></div><span class="sum">לחיצה על תא פותחת את התחום והשלב במעקב המפורט</span></div>
    <div class="card"><div class="board-head"><span class="name">${esc(s.name)}</span><span class="sum">${s.kind==='basement'?'מרחב נפרד מהבניינים'+(s.under?' · מתחת ל'+esc(s.under)+' (מידע בלבד)':''):`${s.levels.length} מפלסים · ${aptCount(s)} דירות`}</span></div>
      <div class="scroll"><table><thead><tr><th rowspan="2">מפלס</th>${head1}</tr><tr>${head2}</tr></thead><tbody>${lvRows}</tbody>
      <tfoot><tr><td class="l">סה"כ שלב</td>${foot}</tr><tr><td class="l">סה"כ תחום (משוקלל)</td>${tfoot}</tr></tfoot></table></div></div>`;
  return bTable + zTable + detail + `<div class="legend"><span><i style="background:var(--c0)"></i>לא התחיל / לא רלוונטי</span><span><i style="background:var(--c1)"></i>עד 25%</span><span><i style="background:var(--c2)"></i>25-50%</span><span><i style="background:var(--c3)"></i>50-99%</span><span><i style="background:var(--c5)"></i>הושלם</span></div>
    <div class="note">האחוז במפלס הוא שקלול של פריטי השלב (שלב לפי מפלס) או של הדירות והלובי (שלב לפי מרכיב; משקל הלובי נקבע בנפרד). סה"כ שלב = ממוצע המפלסים. סה"כ תחום = שקלול השלבים לפי המשקלים שהוגדרו ב"תבניות".</div>`;

/* ---------- detailed tracking */
function trackView(){
  if(!sites.length) return onboardingCard();
  const s = siteById(curS), t = tradeById(curT);
  if(!t) return '<div class="warnbox">לא הוגדרו תחומים. עבור ללשונית "תבניות".</div>';
  const ph = phaseOf(t,curP), pk = phaseKey(t,ph), as = currentAssign(s.id,t.id);
  const phaseChips = t.phases.map(p=>`<button class="chip ${p.id===ph.id?'on':''}" data-phase="${p.id}">${esc(p.name)}<small>${fp(phasePct(s,t,p,curGet))}</small></button>`).join('');
  const conLine = as
    ? `<span>קבלן מבצע - ${esc(t.name)} · ${esc(s.name)}: <b>${esc(contractorName(as.contractorId))}</b>${as.from>BEGIN?` (מתאריך ${fmt(as.from)})`:''}</span><button class="btn secondary small" id="swapBtn">החלף קבלן מבצע</button>`
    : `<span>לא הוקצה קבלן מבצע ל${esc(t.name)} ב${esc(s.name)}</span><span class="right"><select id="firstCon">${contractorOptions('', 'בחר קבלן...')}</select><button class="btn small" id="firstConBtn">הקצה</button></span>`;
  const head = `
    <div class="chips"><span class="lbl">תחום:</span>${trades.map(x=>`<button class="chip ${x.id===t.id?'on':''}" data-trade="${x.id}">${esc(x.name)}</button>`).join('')}</div>
    <div class="chips"><span class="lbl">שלב:</span>${phaseChips}</div>
    <div class="bar"><div><label>בניין / מרתף</label><select id="selS">${siteOptions(s.id)}</select></div>${s.kind==='basement'&&s.under?`<span class="sum">מרחב נפרד מהבניינים · מתחת ל${esc(s.under)} (מידע בלבד)</span>`:''}</div>
    <div class="curcon">${conLine}</div>`;
  let body;
  if(ph.mode==='level'){
    const cols = ph.levelItems||[];
    const rows = levelsTopDown(s).map(lv=>{
      const unit = 'L:'+lv.id, lp = levelPct(s,t,ph,lv,curGet);
      const here = levelItemsFor(ph,lv);
      const cells = cols.map(i=>{ if(!here.includes(i)) return '<td class="na">—</td>'; const k = keyOf(s.id,pk,unit,i.n), p = curGet(k), r = reminders.find(x=>x.key===k && x.status==='open'); const bell = r ? '<span class="bell">🔔</span>' : '';
        return `<td><button class="cell ${bandOf(p)}" data-cell="${esc(k)}">${bell}${pctTxt(p)}</button></td>`; }).join('');
      return `<tr><td class="lvl">${esc(lv.name)}</td>${cells}<td class="lvlpct">${fp(lp)}</td></tr>`;
    }).join('');
    body = `<div class="card"><div class="board-head"><span class="name">${esc(s.name)} · ${esc(ph.name)}</span><span class="total">${fp(phasePct(s,t,ph,curGet))}</span></div>
      <div class="scroll"><table><thead><tr><th>מפלס</th>${cols.map(i=>`<th>${esc(i.n)}</th>`).join('')}<th>% מפלס</th></tr></thead><tbody>${rows}</tbody></table></div>
      <div class="sum" style="margin-top:6px;">שלב לפי מפלס - לחיצה על תא פותחת עדכון (אחוז, תאריך, הערה ותזכורת).</div></div>`;
  } else if(!s.levels.some(l=>l.comps.length)){
    body = `<div class="card"><div class="board-head"><span class="name">${esc(s.name)} · ${esc(ph.name)}</span><span class="total">—</span></div>
      <div class="empty">השלב "${esc(ph.name)}" מתנהל לפי דירות ולובי, ולכן אינו חל על ${esc(s.name)} (מרחב ללא דירות). בחר שלב אחר של התחום.</div></div>`;
  } else {
    const rows = levelsTopDown(s).map(lv=>{
      const lp = levelPct(s,t,ph,lv,curGet);
      const tiles = lv.comps.map(c=>{
        const items = unitItems(ph,c);
        const lw = ph.lobbyWeight==null?1:ph.lobbyWeight;
        if(!items.length || (c.kind==='lobby' && lw<=0)) return `<div class="tile na ${c.kind==='lobby'?'lobby':''}"><div class="tn">${esc(c.name)}</div><div class="tt">אין פריטים</div></div>`;
        const p = unitPct(s.id,pk,c.id,items,curGet);
        return `<button class="tile ${bandOf(p)} ${c.kind==='lobby'?'lobby':''} ${picked.has(c.id)?'picked':''}" data-comp="${esc(c.id)}"><div class="tn">${esc(c.name)}</div><div class="tp">${pctTxt(p)}</div>${c.kind==='apartment'?`<div class="tt">${esc(c.rooms||'')}${c.rooms?" חד' · ":''}${c.lay?'טיפוס '+esc(c.lay):''}</div><span class="typebadge ${typeCls(c.type)}">${esc(c.type)}</span>`:'<div class="tt">שטח משותף</div>'}</button>`;
      }).join('');
      return `<div class="frow ${selectMode?'selectable':''}"><div class="fl" data-picklevel="${esc(lv.id)}">${esc(lv.name)}<span class="pc">${fp(lp)}</span></div><div class="tiles">${tiles}</div></div>`;
    }).join('');
    body = `<div class="card"><div class="board-head"><span class="name">${esc(s.name)} · ${esc(ph.name)}</span><span class="total">${fp(phasePct(s,t,ph,curGet))}</span></div>
      <div class="bar"><button class="btn secondary small ${selectMode?'on':''}" id="selToggle">${selectMode?'✔ מצב בחירה מרובה פעיל':'בחירה מרובה'}</button>
        <button class="btn small" id="bulkBtn" ${picked.size?'':'disabled'}>עדכון מרובה (${picked.size})</button>
        <button class="btn secondary small" id="clearPick" ${picked.size?'':'disabled'}>נקה בחירה</button>
        <span class="sum">${selectMode?'לחיצה על דירה או לובי מוסיפה/מסירה מהבחירה; לחיצה על שם קומה בוחרת את כל הקומה':'לחיצה על דירה פותחת את הפריטים שלה'}</span></div>
      <div class="facade">${rows}</div>
      <div class="legend">${settings.aptTypes.map(ty=>`<span><span class="typebadge ${typeCls(ty)}">${esc(ty)}</span></span>`).join('')}<span>מסגרת מקווקוות = לובי · משקל לובי בשלב: ${ph.lobbyWeight==null?1:ph.lobbyWeight} (דירה = 1)</span></div></div>`;
  }
  return head + body;
}

/* ---------- templates (trades / phases / items / variants) */

const byNameHe = (a,b)=> String(a.name).localeCompare(String(b.name),'he',{numeric:true});
function derivedSiteIds(contractorId){ const set = new Set(); assignments.forEach(a=>{ if(a.contractorId===contractorId && !a.to) set.add(a.siteId); }); return [...set]; }
/* Buildings cell: the explicitly chosen buildings, plus (muted) buildings where the contractor is the performing contractor of some trade */
function sitesCellHtml(explicitIds, contractorId){
  const ex = sites.filter(s=>(explicitIds||[]).includes(s.id));
  const extra = sites.filter(s=>!(explicitIds||[]).includes(s.id) && derivedSiteIds(contractorId).includes(s.id));
  const chip = (s,muted)=> `<span class="typebadge ${muted?'':'t2'}" style="${muted?'background:#94A3B8;':''} margin:1px;" title="${muted?'מבצע בפועל תחום בבניין זה (מההקצאות)':'משויך'}">${esc(s.name)}</span>`;
  const html = ex.map(s=>chip(s,false)).join(' ') + (extra.length ? ` <span class="sum">(מבצע גם: </span>${extra.map(s=>chip(s,true)).join(' ')}<span class="sum">)</span>` : '');
  return html || '<span class="sum">—</span>';
}
function contractorsTableHtml(){
  if(!contractors.length) return '<div class="sum">אין עדיין קבלנים.</div>';
  const rows = [];
  [...contractors].sort(byNameHe).forEach(c=>{
    const cr = crews.filter(x=>x.contractorId===c.id).sort(byNameHe);
    const used = assignments.some(a=>a.contractorId===c.id && !a.to);
    const cCell = `<td class="l" rowspan="${Math.max(cr.length,1)}"><b>${esc(c.name)}</b>${c.active===false?' <span class="sum">(לא פעיל)</span>':''}${c.srcId?' <span title="מקושר לקבלן ביומן היומי">🔗</span>':''}
      <div class="right" style="margin-top:4px;"><button class="btn secondary small" data-conedit="${c.id}">ערוך</button><button class="btn secondary small" data-addcrew="${c.id}">+ צוות</button>
      <button class="btn secondary small" data-concactive="${c.id}">${c.active===false?'החזר לפעיל':'לא פעיל'}</button>
      <button class="btn danger small" data-condel="${c.id}" ${used?'disabled title="מוקצה כרגע לתחום - קודם מחליפים אותו"':''}>הסר</button></div></td>`;
    if(!cr.length) rows.push(`<tr>${cCell}<td class="sum">—</td><td class="l">${sitesCellHtml(c.siteIds,c.id)}</td></tr>`);
    else cr.forEach((x,i)=> rows.push(`<tr>${i===0?cCell:''}<td class="l">${esc(x.name)}${x.active===false?' <span class="sum">(לא פעיל)</span>':''}${x.srcId?' <span title="מקושר לצוות ביומן היומי">🔗</span>':''}${x.description?`<div class="sum">${esc(x.description)}</div>`:''} <button class="btn secondary small" data-crewedit="${x.id}">ערוך</button></td><td class="l">${sitesCellHtml(x.siteIds,c.id)}</td></tr>`));
  });
  return `<div class="scroll"><table><thead><tr><th>קבלן</th><th>צוות</th><th>בניינים</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}
function sitesCheckboxesHtml(selected){

const checkedSites = ()=> [...document.querySelectorAll('#editorBox .stchk:checked')].map(x=>x.value);
function openContractorModal(id){

  document.getElementById('edCancel').onclick = closeModal;
  document.getElementById('mcSave').onclick = ()=>{ const n = cleanName(document.getElementById('mcName').value); if(!n){ toast('נא למלא שם'); return; }
    if(crews.some(x=>x.id!==crewId && x.contractorId===contractorId && x.name===n)){ toast('צוות בשם זה כבר קיים אצל הקבלן'); return; }
    const data = {name:n, description:cleanName(document.getElementById('mcDesc').value), siteIds:checkedSites()};
    if(cr){ Object.assign(cr, data, {active:document.getElementById('mcActive').checked}); } else { crews.push({id:uid('cw'), contractorId, active:true, ...data}); }
    saveAll(); closeModal(); render(); };
  const del = document.getElementById('mcDel'); if(del) del.onclick = ()=>{ if(confirm(`למחוק את הצוות "${cr.name}"?`)){ crews = crews.filter(x=>x.id!==cr.id); saveAll(); closeModal(); render(); } };
}
/* Daily-log sync: contractors and crews of the daily-log app (its own Drive file) are added here; linked ones are matched by
   their original id (srcId) - or, the first time, by identical name - and get their name / active flag (crews: name / description)
   updated. Nothing is ever deleted, and buildings / assignments set here are never touched. */
async function fetchDailyLogData(){
  const q = encodeURIComponent(`name='יומן-עבודה-נתונים.json' and trashed=false`);
  const r = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,modifiedTime)`);
  const j = await r.json(); if(!r.ok) throw new Error(j.error ? j.error.message : 'שגיאה בחיפוש קובץ היומן');
  if(!j.files || !j.files.length) throw new Error('קובץ היומן לא נמצא ב-Drive (ייתכן שלאפליקציה אין גישה אליו). אפשר לייבא מקובץ גיבוי של היומן.');
  const c = await driveFetch(`https://www.googleapis.com/drive/v3/files/${j.files[0].id}?alt=media`);
  if(!c.ok) throw new Error('שגיאה בקריאת קובץ היומן');
  return await c.json();
}
function diffDailyLog(dl){
  const dc = Array.isArray(dl.contractors) ? dl.contractors : [], dcr = Array.isArray(dl.crews) ? dl.crews : [];
  const addC = [], updC = [], addCr = [], updCr = [], mapC = new Map();
  dc.forEach(src=>{
    const name = cleanName(src.name); if(!name || !src.id) return;
    const act = src.active !== false;
    const loc = contractors.find(c=>c.srcId===src.id) || contractors.find(c=>!c.srcId && c.name===name);
    if(loc){ mapC.set(src.id, loc); if(loc.name!==name || (loc.active!==false)!==act || loc.srcId!==src.id) updC.push({loc, name, active:act, srcId:src.id}); }
    else { const o = {id:uid('c'), name, active:act, srcId:src.id, siteIds:[]}; addC.push(o); mapC.set(src.id, o); }
  });
  dcr.forEach(src=>{
    const owner = mapC.get(src.contractorId), name = cleanName(src.name); if(!owner || !name || !src.id) return;
    const desc = cleanName(src.description||'');
    const loc = crews.find(x=>x.srcId===src.id) || crews.find(x=>!x.srcId && x.contractorId===owner.id && x.name===name);
    if(loc){ if(loc.name!==name || (loc.description||'')!==desc || loc.srcId!==src.id || loc.contractorId!==owner.id) updCr.push({loc, name, description:desc, srcId:src.id, contractorId:owner.id}); }
    else addCr.push({id:uid('cw'), contractorId:owner.id, name, description:desc, active:true, srcId:src.id, siteIds:[]});
  });
  return {addC, updC, addCr, updCr};
}
function openSyncPreview(dl, sourceLabel){
  const d = diffDailyLog(dl), total = d.addC.length + d.updC.length + d.addCr.length + d.updCr.length;
  const list = (title, arr, f)=> arr.length ? `<div class="sum" style="margin-top:8px;"><b>${title} (${arr.length}):</b> ${arr.slice(0,25).map(x=>esc(f(x))).join(' · ')}${arr.length>25?' ...':''}</div>` : '';
  modal(`<h2>סנכרון קבלנים וצוותים מהיומן היומי</h2><div class="sub">${esc(sourceLabel)}</div>
    ${total ? `${list('קבלנים חדשים',d.addC,x=>x.name)}${list('צוותים חדשים',d.addCr,x=>`${x.name} (${(d.addC.find(c=>c.id===x.contractorId)||contractors.find(c=>c.id===x.contractorId)||{}).name||''})`)}${list('קבלנים שיעודכנו (שם/סטטוס/קישור)',d.updC,x=>x.name)}${list('צוותים שיעודכנו',d.updCr,x=>x.name)}
      <div class="note">לא נמחק דבר, והבניינים וההקצאות שהוגדרו כאן לא משתנים. שם וסטטוס פעיל של קבלן מקושר נלקחים מהיומן.</div>`
      : '<div class="empty">הכול כבר מסונכרן - אין קבלנים או צוותים חדשים ביומן.</div>'}
    <div class="right" style="margin-top:12px;">${total?'<button class="btn" id="syApply">בצע סנכרון</button>':''}<button class="btn secondary" id="edCancel">${total?'ביטול':'סגור'}</button></div>`);
  document.getElementById('edCancel').onclick = closeModal;
  const ap = document.getElementById('syApply'); if(ap) ap.onclick = ()=>{
    d.addC.forEach(c=> contractors.push(c)); d.addCr.forEach(c=> crews.push(c));
    d.updC.forEach(u=>{ u.loc.name = u.name; u.loc.active = u.active; u.loc.srcId = u.srcId; });
    d.updCr.forEach(u=>{ u.loc.name = u.name; u.loc.description = u.description; u.loc.srcId = u.srcId; u.loc.contractorId = u.contractorId; });
    saveAll(); closeModal(); render(); toast(`סונכרנו: ${d.addC.length} קבלנים ו-${d.addCr.length} צוותים חדשים, ${d.updC.length+d.updCr.length} עודכנו`);
  };
}

/* ---------- monthly report (level granularity) */
function reportRows(){
  const from = rMonth+'-01', startGet = getAt(addDays(from,-1)), endGet = getAt(rMonth+'-31'), rows = [];
  sites.forEach(s=>{ if(rS!=='all' && rS!==s.id) return;
    trades.forEach(t=>{ if(rTrade!=='all' && rTrade!==t.id) return;
      const con = contractorAt(s.id,t.id,rMonth+'-31'); if(rCon!=='all' && rCon!==con) return;
      t.phases.forEach(ph=> [...s.levels].forEach(lv=>{
        const a = levelPct(s,t,ph,lv,startGet), b = levelPct(s,t,ph,lv,endGet);
        if(a==null || b==null || Math.abs(b-a)<0.05) return;
        rows.push({site:s.name, trade:t.name, phase:ph.name, level:lv.name, con, s:a, e:b});
      }));
    });
  });
  return rows;
}

function dueLabel(r){
  const d = remVis(r), today = todayStr();
  if(r.status==='done') return '<span class="pill done">בוצע</span>';
  if(d<today) return `<span class="pill over">באיחור ${Math.round((new Date(today)-new Date(d))/864e5)} ימים</span>`;
  if(d===today) return '<span class="pill today">היום</span>';
  return `<span class="pill soon">בעוד ${Math.round((new Date(d)-new Date(today))/864e5)} ימים</span>`;
}

/* ============================================================== import / structure */
function parseAptTable(text){
  const rows = [];
  String(text||'').split(/\r?\n/).forEach(line=>{
    if(!line.trim()) return;
    // tab (pasted from Excel) - or, for a CSV file, comma / semicolon; as a last resort two or more spaces
    const sep = line.includes('\t') ? '\t' : (line.includes(';') ? ';' : (line.includes(',') ? ',' : /\s{2,}/));
    const c = line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));
    if(c.length<3) return;
    const b = parseInt(c[0],10), f = parseInt(c[1],10), n = parseInt(c[2],10);
    if(isNaN(b)||isNaN(f)||isNaN(n)) return;
    rows.push({b, f, n, lay:cleanName(c[3]||''), rooms:cleanName(c[4]||''), area:cleanName(c[5]||''), pt:/^(כן|yes|true|1)$/i.test(c[6]||'')});
  });
  return rows;
}
/* Reads an uploaded file into tab-separated text. .xlsx/.xls go through SheetJS (loaded from cdnjs only when needed;
   first sheet), anything else (.csv/.tsv/.txt) is read as text. */
const SHEETJS_URL = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadScriptOnce(url){
  return new Promise((resolve,reject)=>{
    if(window.XLSX) return resolve();
    const s = document.createElement('script'); s.src = url; s.onload = ()=> resolve(); s.onerror = ()=> reject(new Error('טעינת רכיב קריאת Excel נכשלה - בדוק חיבור לאינטרנט, או שמור את הקובץ כ-CSV'));
    document.head.appendChild(s);
  });
}
async function readImportFile(file){
  if(/\.(xlsx|xls)$/i.test(file.name)){
    await loadScriptOnce(SHEETJS_URL);
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {header:1, defval:''});
    return rows.map(r=> r.map(x=> String(x).trim()).join('\t')).join('\n');
  }
  return await file.text();
}
function importApartments(rows, opts){
  const byB = {};
  rows.forEach(r=>{ ((byB[r.b] = byB[r.b] || {})[r.f] = byB[r.b][r.f] || []).push(r); });
  let nb = 0, na = 0;
  Object.keys(byB).map(Number).sort((a,b)=>a-b).forEach(b=>{
    const id = 'b'+b, floors = Object.keys(byB[b]).map(Number).sort((x,y)=>x-y);
    const levels = floors.map(f=>{
      const comps = byB[b][f].sort((x,y)=>x.n-y.n).map(a=>({id:`${id}-${f}-a${a.n}`, kind:'apartment', name:'דירה '+a.n, type: a.pt ? 'מחיר למשתכן' : 'שוק חופשי', lay:a.lay, rooms:a.rooms, area:a.area}));
      if(opts.lobby) comps.push({id:`${id}-${f}-lobby`, kind:'lobby', name:'לובי'});
      return {id: f===0 ? 'קרקע' : 'קומה '+f, name: f===0 ? 'קרקע' : 'קומה '+f, comps};
    });
    if(opts.pent && levels.length>1){ const top = levels[levels.length-1], apts = top.comps.filter(c=>c.kind==='apartment'); if(apts.length===1) apts[0].type = 'פנטהאוז'; }
    na += levels.reduce((n,l)=>n+l.comps.filter(c=>c.kind==='apartment').length,0);
    const ex = siteById(id);
    if(ex){ ex.levels = levels; } else { sites.push({id, kind:'building', name:'בניין '+b, under:'', levels}); }
    nb++;
  });
  ['שוק חופשי','מחיר למשתכן','פנטהאוז'].forEach(ty=>{ if(!settings.aptTypes.includes(ty)) settings.aptTypes.push(ty); });
  sites.sort((x,y)=> (x.kind===y.kind ? 0 : x.kind==='building' ? -1 : 1) || String(x.name).localeCompare(String(y.name),'he',{numeric:true}));
  return {nb, na};
}
function addZone(name, under, levelNames){
  const id = uid('z');
  sites.push({id, kind:'basement', name:cleanName(name)||'מרתף', under:cleanName(under), levels: levelNames.map(n=>({id:cleanName(n), name:cleanName(n), comps:[]}))});
}

function pathList(t, path){ const [pi,kind,ty] = path.split('|'), ph = t.phases[+pi];

  if(kind==='apartment') return ph.compItems.apartment;
  if(kind==='lobby') return ph.compItems.lobby;
  ph.variants = ph.variants || {}; const v = ph.variants[ty] || (ph.variants[ty] = {add:[],remove:[]}); return (v.add = v.add || []); }

/* ---- 3-way merge (same engine as the daily-log app): a collection of {id} rows merges row by row, a record field by field */
function deepEqual(a,b){
  if(a===b) return true; if(a==null||b==null) return a===b; if(typeof a!==typeof b) return false; if(typeof a!=='object') return a===b;
  if(Array.isArray(a)!==Array.isArray(b)) return false;
  if(Array.isArray(a)){ if(a.length!==b.length) return false; for(let i=0;i<a.length;i++) if(!deepEqual(a[i],b[i])) return false; return true; }
  const ak = Object.keys(a), bk = Object.keys(b); if(ak.length!==bk.length) return false;
  for(const k of ak){ if(!Object.prototype.hasOwnProperty.call(b,k) || !deepEqual(a[k],b[k])) return false; } return true;
}
function mergeField(base, local, remote){
  const lc = !deepEqual(local,base), rc = !deepEqual(remote,base);
  if(!rc) return {value:local, conflict:false}; if(!lc) return {value:remote, conflict:false};
  if(deepEqual(local,remote)) return {value:local, conflict:false};
  return {value:local, conflict:true};
}
function mergeRecord(base, local, remote){
  const merged = {...local}; let conflicts = 0;
  new Set([...Object.keys(local||{}), ...Object.keys(remote||{}), ...Object.keys(base||{})]).forEach(k=>{ const r = mergeField(base&&base[k], local&&local[k], remote&&remote[k]); merged[k] = r.value; if(r.conflict) conflicts++; });
  return {record:merged, conflicts};
}
function mergeRows(baseArr, localArr, remoteArr){
  baseArr = Array.isArray(baseArr)?baseArr:[]; localArr = Array.isArray(localArr)?localArr:[]; remoteArr = Array.isArray(remoteArr)?remoteArr:[];
  const bm = new Map(baseArr.filter(r=>r&&r.id).map(r=>[r.id,r])), lm = new Map(localArr.filter(r=>r&&r.id).map(r=>[r.id,r])), rm = new Map(remoteArr.filter(r=>r&&r.id).map(r=>[r.id,r]));
  const ids = []; const seen = new Set(); [...localArr, ...remoteArr].forEach(r=>{ if(r&&r.id&&!seen.has(r.id)){ ids.push(r.id); seen.add(r.id); } });
  const merged = []; let conflicts = 0;
  ids.forEach(id=>{ const b = bm.get(id), l = lm.get(id), r = rm.get(id);
    if(l && !r){ if(b && deepEqual(l,b)) return; merged.push(l); return; }
    if(!l && r){ if(b && deepEqual(r,b)) return; if(!b){ merged.push(r); return; } return; }
    if(!l && !r) return;
    const m = mergeRecord(b,l,r); merged.push(m.record); conflicts += m.conflicts; });
  return {merged, conflicts};
}

const getColl = n => ({contractors, crews, assignments, sites, trades, entries, reminders})[n];
function setColl(n,v){ if(n==='contractors') contractors=v; else if(n==='crews') crews=v; else if(n==='assignments') assignments=v; else if(n==='sites') sites=v; else if(n==='trades') trades=v; else if(n==='entries') entries=v; else if(n==='reminders') reminders=v; }

async function driveSaveNow(){
  if(driveSaveInFlight){ driveSavePending = true; return; }
  driveSaveInFlight = true;
  const seqAtStart = driveSaveSeq;
  try{
    const metaRes = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?fields=modifiedTime,headRevisionId`);
    const meta = await metaRes.json();
    if(!metaRes.ok) throw new Error(meta.error ? meta.error.message : 'שגיאה בבדיקת הקובץ');
    if(driveFileModifiedTime && driveVersion(meta) !== driveFileModifiedTime){
      const contentRes = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}?alt=media`);
      if(!contentRes.ok) throw new Error('שגיאה בקריאת הגרסה העדכנית מ-Drive לצורך מיזוג');
      const remote = await contentRes.json(), base = baseSnapshot || remote; let conflicts = 0;
      COLLECTIONS.forEach(n=>{ const r = mergeRows(base[n], getColl(n), remote[n]); setColl(n, r.merged); conflicts += r.conflicts; });
      const sr = mergeRecord(base.settings, settings, remote.settings); settings = sr.record; conflicts += sr.conflicts;
      invalidateIndex();
      if(conflicts) toast(`מוזגו שינויים של משתמש אחר - ${conflicts} פריט/ים נערכו בו-זמנית (נשמרה הגרסה שלך)`);
      render();
    }
    const putRes = await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${driveFileId}?uploadType=media&fields=modifiedTime,headRevisionId`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(buildPayload())});
    const putJson = await putRes.json();
    if(!putRes.ok) throw new Error(putJson.error ? putJson.error.message : 'שגיאה בשמירה');
    driveFileModifiedTime = driveVersion(putJson); baseSnapshot = snapshotPayload();
    if(driveSaveSeq === seqAtStart) driveDirty = false;
    driveAuthBroken = false; hideDriveProblem();
    setDriveStatus('נשמר · ' + new Date().toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    setDriveStatus('⚠ שגיאת שמירה: ' + e.message);
    showDriveProblem(e.auth ? 'auth' : 'error', e.auth ? e.message : ('שגיאת שמירה ל-Drive: ' + e.message));
  }finally{
    driveSaveInFlight = false;
    if(driveSavePending){ driveSavePending = false; driveSaveNow(); }
  }
}
/* explicit "💾 שמור": no debounce, and says clearly whether it reached Drive */
async function flushSave(){
  if(!driveFileId){ toast('אין חיבור ל-Drive - נא להתחבר'); return; }
  if(!driveDirty && !driveSaveInFlight && !driveSavePending){ toast('הכול כבר שמור ב-Drive ✓'); return; }
  clearTimeout(driveSaveTimer); setDriveStatus('שומר...');
  const t0 = Date.now(); driveSaveNow();
  while((driveSaveInFlight || driveSavePending) && Date.now()-t0 < 60000) await new Promise(r=>setTimeout(r,150));
  toast(driveDirty ? '⚠ השמירה לא הושלמה - ראה את ההודעה' : 'נשמר ב-Drive ✓');
}

/* ---- token handling (same hardening as the daily-log app: error_callback, timeouts, one refresh at a time, explicit re-sign-in dialog) */
function makeTokenClient(){ return google.accounts.oauth2.initTokenClient({client_id:DRIVE_CLIENT_ID, scope:DRIVE_SCOPES, callback:onDriveSignIn, error_callback:(err)=>{ if(pendingTokenError) pendingTokenError(err); }}); }
function requestFreshToken(timeoutMs, force){
  if(tokenRefreshPromise){ if(!force) return tokenRefreshPromise; if(pendingTokenError) pendingTokenError({type:'superseded_by_user_click'}); }
  if(force && typeof google!=='undefined' && google.accounts) tokenClient = makeTokenClient();
  tokenRefreshPromise = new Promise((resolve,reject)=>{
    let settled = false, timer = null;
    const finish = (fn,val)=>{ if(settled) return; settled = true; clearTimeout(timer); tokenClient.callback = onDriveSignIn; pendingTokenError = null; tokenRefreshPromise = null; fn(val); };
    timer = setTimeout(()=>finish(reject,new Error('token refresh timed out')), timeoutMs||20000);
    pendingTokenError = err=> finish(reject,new Error('token refresh failed: '+((err&&(err.type||err.message))||'unknown')));
    tokenClient.callback = resp=>{ if(resp.error){ finish(reject,new Error(resp.error_description||resp.error)); return; } accessToken = resp.access_token; if(resp.expires_in) scheduleTokenRefresh(resp.expires_in); driveAuthBroken = false; finish(resolve,accessToken); };
    try{ const cfg = {prompt:''}; if(me && me.email) cfg.hint = me.email; tokenClient.requestAccessToken(cfg); }catch(e){ finish(reject,e); }
  });
  return tokenRefreshPromise;
}
function scheduleTokenRefresh(sec){ clearTimeout(tokenRefreshTimer); tokenRefreshTimer = setTimeout(()=>{ requestFreshToken(20000).catch(()=>{ driveAuthBroken = true; showDriveProblem('auth','החיבור ל-Google Drive עומד לפוג. לחץ כדי לחדש אותו - כך שום שינוי לא יאבד.'); }); }, Math.max((sec-300)*1000, 30000)); }
async function driveFetch(url, options={}){
  const opts = Object.assign({}, options, {headers:Object.assign({}, options.headers, {Authorization:'Bearer '+accessToken})});
  let res = await fetch(url, opts);
  if(res.status===401){
    const authError = ()=>{ const e = new Error('החיבור ל-Google Drive פג ולא ניתן לחדש אותו אוטומטית'); e.auth = true; return e; };
    if(driveAuthBroken) throw authError();
    try{ await requestFreshToken(20000); }catch(e){ driveAuthBroken = true; throw authError(); }
    opts.headers.Authorization = 'Bearer '+accessToken; res = await fetch(url, opts);
  }
  return res;
}
let dpDismissedUntil = 0;
function showDriveProblem(kind, message){
  if(kind!=='auth' && Date.now() < dpDismissedUntil) return;
  let bar = document.getElementById('driveProblemBar');
  if(!bar){ bar = document.createElement('div'); bar.id = 'driveProblemBar'; bar.className = 'no-print'; document.body.appendChild(bar); }
  if(bar.style.display==='flex' && bar.dataset.kind===kind) return;
  bar.dataset.kind = kind;
  bar.innerHTML = `<div class="dp-box"><div class="dp-icon">⚠</div><h2>${kind==='auth'?'נדרש חיבור מחדש ל-Google Drive':'השמירה ל-Drive נכשלה'}</h2><p>${esc(message)}</p>
    <p class="dp-warn">השינויים האחרונים עדיין <b>לא נשמרו</b>. אל תסגור ואל תרענן את הדף לפני שהשמירה מצליחה.</p>
    <div class="dp-actions"><button type="button" class="btn" id="dpFix">${kind==='auth'?'התחבר מחדש ושמור':'נסה לשמור שוב'}</button><button type="button" class="btn secondary" id="dpBackup">הורד גיבוי של מה שבמסך</button>${kind==='auth'?'':'<button type="button" class="btn secondary" id="dpClose">סגור (ינסה שוב ברקע)</button>'}</div></div>`;
  bar.style.display = 'flex';
  if(!document.title.startsWith('⚠')) document.title = '⚠ ' + document.title;
  document.getElementById('dpBackup').onclick = ()=>{ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(buildPayload())],{type:'application/json'})); a.download = `גיבוי-לא-שמור-${todayStr()}.json`; a.click(); };
  const cb = document.getElementById('dpClose'); if(cb) cb.onclick = ()=>{ dpDismissedUntil = Date.now()+5*60*1000; hideDriveProblem(); };
  document.getElementById('dpFix').onclick = ()=>{
    if(kind==='auth'){
      const fb = document.getElementById('dpFix'); fb.disabled = true; fb.textContent = 'ממתין לחלון ההתחברות של Google...';
      requestFreshToken(120000, true).then(()=>{ hideDriveProblem(); saveAll(); }).catch(e=>{ fb.disabled = false; fb.textContent = 'נסה שוב להתחבר'; toast('ההתחברות לא הושלמה: '+String(e&&e.message||e)); });
    } else { hideDriveProblem(); saveAll(); }
  };
}
function hideDriveProblem(){ const bar = document.getElementById('driveProblemBar'); if(bar) bar.style.display = 'none'; if(document.title.startsWith('⚠ ')) document.title = document.title.slice(2); }
window.addEventListener('beforeunload', e=>{ if(driveDirty){ e.preventDefault(); e.returnValue = ''; return ''; } });
setInterval(()=>{ if(driveDirty && !driveSaveInFlight && !driveAuthBroken && !tokenRefreshPromise && driveFileId) saveAll(); }, 45000);

window.addEventListener('load', ()=>{
  if(typeof google==='undefined' || !google.accounts){ gateStatus('שגיאה: ספריית ההתחברות של Google לא נטענה. בדוק חיבור לאינטרנט ורענן את הדף.'); return; }
  tokenClient = makeTokenClient();
  document.getElementById('gateSignInBtn').onclick = ()=>{ gateStatus('פותח חלון התחברות של Google...'); tokenClient.requestAccessToken({prompt:''}); };
});
async function onDriveSignIn(resp){
  if(resp.error){ gateStatus('שגיאה בהתחברות: '+resp.error+(resp.error_description?(' - '+resp.error_description):'')); return; }
  accessToken = resp.access_token; if(resp.expires_in) scheduleTokenRefresh(resp.expires_in);
  gateStatus('טוען נתונים מ-Drive...');
  try{
    const r = await loadOrCreateDriveFile();
    if(r === 'needFile'){ showFileNeededGate(); return; }
    await afterDataLoaded();
  }catch(e){ gateStatus('שגיאה בטעינת הנתונים מ-Drive: '+e.message); }
}
async function afterDataLoaded(){
  try{ const u = await (await driveFetch('https://www.googleapis.com/oauth2/v3/userinfo')).json(); me = {name:u.name||(u.email||'').split('@')[0]||'משתמש', email:(u.email||'').toLowerCase()}; }catch(e){ me = {name:'משתמש', email:''}; }
  document.getElementById('signInGate').style.display = 'none';
  document.getElementById('topbar').style.visibility = 'visible';
  render(); showPopup(false);
}

/* ---- Connecting a NEW user to the shared data file (23.10.2026) - same mechanism as the daily-log app.
   With the drive.file scope an app only sees files it created or that the user explicitly OPENED with it (Google Picker);
   a file merely SHARED with a user is invisible, and used to be silently replaced by a new empty file of his own.
   Now: the admin shares the Drive file; the new user picks it once (remembered in this browser); only the admin creates the first file. */
const ADMIN_EMAILS = ['r0504433364@gmail.com'];
const PICKER_API_KEY = '';              // browser key, restricted to https://espeton.github.io/* and "Google Picker API" - see README
const PICKER_APP_ID = '313815811753';   // Google Cloud project number
const FILE_ID_KEY = 'dataFileId:' + DRIVE_FILE_NAME;
let currentEmail = '';
const isAdminEmail = e => ADMIN_EMAILS.includes(String(e||'').toLowerCase());
function storedFileId(){ try{ return localStorage.getItem(FILE_ID_KEY) || ''; }catch(e){ return ''; } }
function storeFileId(id){ try{ localStorage.setItem(FILE_ID_KEY, id); }catch(e){} }
function forgetFileId(){ try{ localStorage.removeItem(FILE_ID_KEY); }catch(e){} }
async function fetchEmail(){
  try{ const r = await driveFetch('https://www.googleapis.com/oauth2/v3/userinfo'); const u = await r.json(); currentEmail = (u.email||'').toLowerCase(); }catch(e){}
  return currentEmail;
}
async function readDataFile(id, meta){
  driveFileId = id; driveFileModifiedTime = driveVersion(meta);
  const contentRes = await driveFetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`);
  if(!contentRes.ok) throw new Error('שגיאה בקריאת תוכן הקובץ מ-Drive');
  applyData(await contentRes.json());
  baseSnapshot = snapshotPayload();
}
function loadExternalScript(url, test){
  return new Promise((resolve,reject)=>{
    if(test && test()) return resolve();
    const s = document.createElement('script'); s.src = url; s.onload = ()=> resolve(); s.onerror = ()=> reject(new Error('טעינת רכיב Google נכשלה - בדוק חיבור לאינטרנט'));
    document.head.appendChild(s);
  });
}
function openFilePicker(){
  return loadExternalScript('https://apis.google.com/js/api.js', ()=> window.gapi && gapi.load).then(()=> new Promise(resolve=>{
    gapi.load('picker', ()=>{
      const shared = new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes('application/json').setOwnedByMe(false).setIncludeFolders(false);
      const mine = new google.picker.DocsView(google.picker.ViewId.DOCS).setMimeTypes('application/json').setIncludeFolders(false);
      new google.picker.PickerBuilder().setOAuthToken(accessToken).setDeveloperKey(PICKER_API_KEY).setAppId(PICKER_APP_ID)
        .addView(shared).addView(mine).setLocale('iw').setTitle('בחר את קובץ הנתונים המשותף')
        .setCallback(d=>{ if(d.action==='picked') resolve(d.docs[0]); else if(d.action==='cancel') resolve(null); }).build().setVisible(true);
    });
  }));
}
/* ---- Sharing the data file (admin only, 26.10.2026): the app created the Drive file, so it may manage its permissions.
   Lets the admin share it with another user right from the app (no hunting for the JSON file in Drive) and see who has access. */
function sharingCardInner(){
  return `<h2>שיתוף קובץ הנתונים עם משתמשים</h2>
    <div class="sum" style="margin-bottom:8px;">הקובץ <b>${esc(DRIVE_FILE_NAME)}</b> נוצר על ידי האפליקציה ב-Google Drive שלך. כדי שמשתמש נוסף יראה את אותם נתונים: שתף איתו את הקובץ כאן (עורך), והוא נכנס לאפליקציה ובוחר את הקובץ פעם אחת (מסך "בחר את קובץ הנתונים המשותף").</div>
    <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin-bottom:8px;">
      <div><label>כתובת המייל של המשתמש</label><input type="email" id="sh_email" placeholder="name@gmail.com" style="min-width:250px;"></div>
      <label style="display:flex; gap:6px; align-items:center; margin:0; font-weight:normal;"><input type="checkbox" id="sh_notify" checked style="width:auto;"> שלח הודעה במייל</label>
      <button class="btn" id="sh_add">שתף כעורך</button>
      <a class="btn secondary" href="https://drive.google.com/file/d/${driveFileId}/view" target="_blank" rel="noopener" style="text-decoration:none;">פתח את הקובץ ב-Drive</a>
    </div>
    <div id="sh_list" class="sum">טוען את רשימת הגישה...</div>`;
}
async function refreshSharingList(root){
  const list = root.querySelector('#sh_list'); if(!list) return;
  try{
    const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}/permissions?fields=permissions(id,emailAddress,displayName,role,type)`);
    const j = await r.json(); if(!r.ok) throw new Error(j.error ? j.error.message : 'שגיאה');
    const roleHe = {owner:'בעלים', writer:'עורך', commenter:'מגיב', reader:'צופה'};
    list.innerHTML = `<b>מי יכול לגשת לקובץ:</b>` + (j.permissions||[]).map(p=>`<div style="display:flex; gap:8px; align-items:center; padding:3px 0;"><span>${esc(p.emailAddress||p.displayName||p.type)}</span><span class="sum">${esc(roleHe[p.role]||p.role)}</span>${p.role==='owner'?'':`<button class="btn danger small" data-shrm="${esc(p.id)}">הסר גישה</button>`}</div>`).join('');
    list.querySelectorAll('[data-shrm]').forEach(b=> b.onclick = async ()=>{
      if(!confirm('להסיר את הגישה של המשתמש לקובץ?')) return;
      const dr = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}/permissions/${b.dataset.shrm}`, {method:'DELETE'});
      toast(dr.ok || dr.status===204 ? 'הגישה הוסרה' : 'ההסרה נכשלה'); refreshSharingList(root);
    });
  }catch(e){ list.textContent = 'לא ניתן לטעון את רשימת הגישה: ' + e.message; }
}
function wireSharingCard(root){
  root.querySelector('#sh_add').onclick = async ()=>{
    const email = root.querySelector('#sh_email').value.trim();
    if(!/^\S+@\S+\.\S+$/.test(email)){ toast('נא להזין כתובת מייל תקינה'); return; }
    const notify = root.querySelector('#sh_notify').checked;
    try{
      const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${driveFileId}/permissions?sendNotificationEmail=${notify}`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({role:'writer', type:'user', emailAddress:email})});
      const j = await r.json(); if(!r.ok) throw new Error(j.error ? j.error.message : 'שגיאה');
      toast('הקובץ שותף עם ' + email); root.querySelector('#sh_email').value = ''; refreshSharingList(root);
    }catch(e){ toast('השיתוף נכשל: ' + e.message); }
  };
  refreshSharingList(root);
}
function showFileNeededGate(){
  gateStatus('');
  const card = document.querySelector('#signInGate .card');
  let box = document.getElementById('gateNeedFile');
  if(!box){ box = document.createElement('div'); box.id = 'gateNeedFile'; card.appendChild(box); }
  box.innerHTML = `
    <div class="note" style="background:#FFFBEB; border-color:#F5D98B; color:#7A5A0A;">
      <b>לא נמצא קובץ הנתונים המשותף עבור ${esc(currentEmail||'החשבון הזה')}.</b><br>
      1. המנהל צריך לשתף איתך את הקובץ <b>${esc(DRIVE_FILE_NAME)}</b> ב-Google Drive (שיתוף ← עורך).<br>
      2. לחץ למטה ובחר את הקובץ - פעם אחת בלבד; הבחירה נשמרת בדפדפן הזה.
    </div>
    <div style="margin-top:10px;"><button id="gatePick" class="btn">בחר את קובץ הנתונים המשותף</button></div>
    ${PICKER_API_KEY ? '' : '<div class="hint">בחירת הקובץ עדיין לא הופעלה במערכת - המנהל צריך להגדיר מפתח Google Picker (ראה README).</div>'}`;
  document.getElementById('gatePick').onclick = pickSharedFile;
}
async function pickSharedFile(){
  if(!PICKER_API_KEY){ gateStatus('בחירת הקובץ עדיין לא הופעלה: המנהל צריך להגדיר מפתח Google Picker (ראה README).'); return; }
  try{
    gateStatus('פותח את בחירת הקבצים של Google...');
    const doc = await openFilePicker();
    if(!doc){ gateStatus(''); return; }
    if(doc.name !== DRIVE_FILE_NAME){ gateStatus(`נבחר קובץ בשם "${doc.name}". יש לבחור את הקובץ "${DRIVE_FILE_NAME}".`); return; }
    gateStatus('טוען את הנתונים...');
    const mr = await driveFetch(`https://www.googleapis.com/drive/v3/files/${doc.id}?fields=id,trashed,modifiedTime,headRevisionId`);
    const meta = await mr.json();
    if(!mr.ok) throw new Error(meta.error ? meta.error.message : 'אין גישה לקובץ');
    await readDataFile(doc.id, meta);
    storeFileId(doc.id);
    await afterDataLoaded();
  }catch(e){ gateStatus('שגיאה בחיבור לקובץ: ' + e.message); }
}
async function loadOrCreateDriveFile(){
  await fetchEmail();
  // 1) the file this browser was connected to before (found earlier, or chosen through the Picker)
  const sid = storedFileId();
  if(sid){
    try{
      const r = await driveFetch(`https://www.googleapis.com/drive/v3/files/${sid}?fields=id,trashed,modifiedTime,headRevisionId`);
      const m = await r.json();
      if(r.ok && !m.trashed){ await readDataFile(sid, m); return 'ok'; }
    }catch(e){ if(e && e.auth) throw e; }
    forgetFileId();
  }
  // 2) by name among the files this app can see - a file shared by somebody else wins over a stray copy of one's own
  const q = encodeURIComponent(`name='${DRIVE_FILE_NAME}' and trashed=false`);
  const listRes = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,ownedByMe,modifiedTime,headRevisionId)`);
  const listJson = await listRes.json();
  if(!listRes.ok) throw new Error(listJson.error ? listJson.error.message : 'שגיאה בחיפוש הקובץ ב-Drive');
  if(listJson.files && listJson.files.length>0){
    const f = listJson.files.find(x=>x.ownedByMe===false) || listJson.files[0];
    await readDataFile(f.id, f); storeFileId(f.id); return 'ok';
  }
  // 3) nothing found: only the admin creates the first file; everyone else must connect to the shared one
  if(!isAdminEmail(currentEmail)) return 'needFile';
  {
    applyData({});
    const boundary = 'tracking_boundary_' + Date.now();
    const body = `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({name:DRIVE_FILE_NAME, mimeType:'application/json'})}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(buildPayload())}\r\n--${boundary}--`;
    const createRes = await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime,headRevisionId', {method:'POST', headers:{'Content-Type':'multipart/related; boundary='+boundary}, body});
    const createJson = await createRes.json();
    if(!createRes.ok) throw new Error(createJson.error ? createJson.error.message : 'שגיאה ביצירת הקובץ ב-Drive');
    driveFileId = createJson.id; driveFileModifiedTime = driveVersion(createJson); storeFileId(driveFileId);
  }
  baseSnapshot = snapshotPayload();
  return 'ok';
}
// A file dropped anywhere outside a drop zone must not make the browser navigate to it (that would leave the app)
['dragover','drop'].forEach(ev=> window.addEventListener(ev, e=>{ if(e.dataTransfer && Array.from(e.dataTransfer.types||[]).includes('Files')) e.preventDefault(); }));

window.addEventListener('afterprint', ()=>{ const b = document.getElementById('topbar'); if(b){ b.style.display = b.dataset.pd || ''; } });
